name: ci

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"
  UV_LINK_MODE: copy

jobs:
  lint:
    name: lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-extras --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src/doudou
      # 提交进来的凭据是最贵的一种「测试失败」：一旦推送就只能靠轮换兜底。
      # 因此它放在最显眼的地方，而不是只留给人工 review。
      - run: uv run python scripts/check_secrets.py

  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --all-extras --group dev
      - run: uv run pytest tests/unit --cov=src/doudou --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: coverage
          path: coverage.xml

  security:
    name: security (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-extras --group dev
      # 只审**运行时依赖**：dev 工具不进生产镜像，它们的告警没有处置路径。
      # 查不到可用升级（上游未修）时用 `--ignore-vuln` 显式登记，并且要写清原因 ——
      # 「静默忽略」会让这个 job 慢慢变成装饰品。
      - name: pip-audit
        run: |
          uv export --no-dev --no-emit-project --format requirements-txt > /tmp/requirements.txt
          uv run pip-audit -r /tmp/requirements.txt --progress-spinner off

  docker:
    name: docker build
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: doudou:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # 镜像扫描（trivy）需要拉漏洞库，网络抖动会让 job 假失败；
      # 因此放在**构建之后**单独一步，只扫本次构建的产物，
      # 有 HIGH/CRITICAL 就失败。本地同款命令见 `make scan`。
      - name: trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: doudou:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
