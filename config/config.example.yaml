# ============================================================================
# Doudou 主配置模板
# 复制为 config/config.yaml 后按需修改。
# 优先级：环境变量 > 本文件 > 代码内默认值（见 doudou.config.loader）
# 密钥类字段一律不要写在这里，放到 .env。
# ============================================================================

version: 1

# ---------------------------------------------------------------- 运行环境
runtime:
  env: local                 # local | dev | prod
  debug: true
  log_level: INFO
  log_json: false            # prod 建议 true
  timezone: Asia/Shanghai

server:
  host: 127.0.0.1
  port: 8000
  base_path: /api/v1
  workers: 1                 # 当前只支持单进程，其它值会在校验时拒绝
  cors_origins:
    - http://localhost:5173
  # api_token 从环境变量 DOUDOU_API_TOKEN 读取，不在此处配置

# ---------------------------------------------------------------- 模型
model:
  # provider:model 形式；主模型失败且尚未输出文本时按 fallbacks 顺序尝试备用模型
  primary: openai:gpt-5.5
  fallbacks: []
  temperature: 0.2
  max_tokens: 4096
  timeout: 120
  max_retries: 2
  # 凭据只放 .env：DOUDOU_MODEL_API_KEY（主 provider）
  # 多 provider 用 DOUDOU_MODEL_API_KEYS='{"openai": "...", "anthropic": "..."}'
  api_key: null
  api_keys: {}
  # 供自建/兼容网关使用；多 provider 用 DOUDOU_MODEL_BASE_URLS
  base_url: null
  base_urls: {}

# ---------------------------------------------------------------- Agent
agent:
  name: Doudou
  system_prompt_file: prompts/system.md   # 相对 config/ 目录；留空则用内置默认提示词
  # 助手自己的长期记忆：可列多个（都会注入提示词），但**只有第一个**是 remember 的回写目标。
  # 路径按进程工作目录解析（不是 config/ 目录），所以写 config/AGENTS.md。
  memory_files:
    - config/AGENTS.md                     # 助手记忆：remember 只写这里
  skills:
    - ../skills/                           # Agent Skills 根目录
  # 提示词里最多列出几个技能。索引必须**有界**：技能一多，
  # 光是索引就能把提示词顶坏（超出时会说明「另有 X 个未列出」）。
  skill_index_limit: 40
  # 手工覆盖「哪些工具需要人工确认」。通常不需要写 ——
  # 工具自己用 `side_effects=True` 声明（写文件、执行命令都会自动被拦）。
  # 这里只在两处有用：**关掉**某个工具的确认，或**额外加上**一个。
  interrupt_on:
    # workspace_delete: false   # 例如：删除也信任它（不推荐）
    # shell_exec: true          # 默认已由 side_effects 覆盖，写在这里只是显式化
  # 单次运行的步数上限，防止死循环
  max_steps: 8
  # 多轮防人设漂移：每隔 N 轮用户消息（及摘要压缩后）在用户消息后固化一次锚点并落库，
  # 既稳住人设又保持 Prefix Cache 100% 命中；历史接口与飞书展示会自动剥离该标记。
  # persona_reminder: "保持既定人设与口吻回复，不要退化成普通客服套话。"
  persona_reminder: null
  persona_reminder_interval: 5
  # 续聊旧会话时，若已跨天或距上次对话超过该小时数，在当轮用户消息后固化一条 [时间上下文]（0 表示关闭）。
  time_context_gap_hours: 4.0
  # 等待人工确认的时长（秒）。等不到就按**拒绝**处理 ——
  # 悬着的确认等于没有确认，默认必须偏向安全的一侧。
  approval_timeout_seconds: 300
  # 路径权限规则，按顺序**首匹配生效**，没有匹配到任何规则时**放行**。
  # 匹配的是相对工作区、以 / 开头的 POSIX 路径；工具层已经保证「跑不出工作区」，
  # 这里是更细的限制。想「默认拒绝」就加一条 `paths: ["/**"], mode: deny` 放在最后。
  permissions:
    - operations: [read, write]
      paths: ["/**/.env", "/**/*.pem", "/**/*.key", "/**/secrets/**"]
      mode: deny
  # 子 Agent 定义：被 tools/builtin/delegation.py 读取，生成 `task` 工具的可选项。
  # 子 Agent 看不到主对话（隔离是它的价值所在），所以 description 与 prompt 必须自洽。
  # 工具名必须是**实际装载**的工具（用 `doudou tools list` 查）。
  subagents:
    - name: researcher
      description: 联网检索与资料汇总，产出带来源的结构化调研结论
      prompt: |
        你是资料研究员，负责检索、比对与汇总。

        要求：
        - 给出结论时标注来源链接；区分事实与推断，推断要显式标注。
        - 无法确认的部分写「未确认」，不要编造。
        - 最后只回传一份结构化结论（要点 + 来源），不要贴原始网页内容。
      tools:
        - web_search
        - http_request
        - workspace_read
        - now
      max_steps: 8

    - name: planner
      description: 把模糊目标拆解为可执行步骤与验收标准
      prompt: |
        你是任务规划者。输出必须包含：
        - 目标复述与前提假设
        - 步骤清单（标明依赖关系）
        - 每步的验收标准
        - 主要风险与未知项

        不要执行任务本身，只做规划。不要回传除了这份计划之外的任何内容。
      tools: []
      max_steps: 3

    - name: coder
      description: 编写、修改与调试代码，可执行命令并跑测试
      prompt: |
        你是软件工程助手，负责实现与排错。
        要求：改动最小化；改完必须运行相关测试；说明改动点与风险。
      tools:
        - workspace_read
        - workspace_list
        - workspace_write
        - workspace_edit
        - shell_exec
      max_steps: 12

# ---------------------------------------------------------------- 工具
tools:
  # 空列表 = 全部启用；填分组名则只启用这些。
  # 分组：web / http / browser / files / shell / skills / memory / clock / delegation
  enabled_groups: []
  # 逐个禁用的工具名，优先级高于 enabled_groups
  disabled: []

  # 联网检索：provider = tavily | deepseek，key 都放 DOUDOU_TOOLS_WEB_SEARCH_API_KEY。
  # 缺少 API Key 时该分组整组不注册 ——「永远失败的工具」只会占提示词并诱导模型乱试。
  web_search:
    provider: tavily          # tavily（默认）| deepseek（自研搜索）
    api_key: null             # 只放 .env
    max_results: 5
    search_depth: basic        # 仅 tavily：basic | advanced（更准但更慢更贵）
    include_answer: true       # 仅 tavily：是否附带摘要答案
    need_content: false        # 仅 deepseek：是否返回网页正文（体积大，默认只取 summary）
    timeout: 20

  # 出站 HTTP。**默认拒绝一切**：allowed_domains 为空时工具不注册。
  # - example.com   匹配 example.com 及其任意子域
  # - *.example.com 只匹配子域
  # 此外解析到内网/回环地址的域名一律拒绝（防 SSRF 绕过）。
  http:
    allowed_domains: []
    timeout: 20
    max_response_chars: 20000
    max_redirects: 2
    user_agent: Doudou/0.1 (+personal-assistant)

  # 工作区文件读写。根目录固定为 filesystem.root_dir，不单独配置。
  # 写类工具（workspace_write / workspace_edit / workspace_delete）声明了副作用，
  # 默认每次调用都要人工确认，并且还会过上面 agent.permissions 的路径规则。
  files:
    max_read_chars: 50000
    max_list: 200
    max_write_chars: 200000

  # 命令执行：**默认禁用**。这是唯一没有路径约束机制的出口 ——
  # 权限规则拦不住 `rm -rf /`，只有人工确认这一道。需要真正隔离请用容器/沙箱。
  shell:
    enabled: false
    # 沙箱："" 不隔离；"bwrap" 用 bubblewrap（仅 Linux，需要 apt install bubblewrap）。
    # 开启后只有工作区可写，config/、.env、数据库都不会出现在沙箱里；网络不隔离。
    sandbox: ""
    cwd: null                  # 缺省取 filesystem.root_dir
    timeout: 60
    max_output_chars: 20000
    # 只透传白名单里的环境变量，避免把 *_API_KEY 交给子进程
    inherit_env: ["PATH", "HOME", "LANG", "LC_ALL", "TZ", "TEMP", "TMP"]

  # 本机 Google Chrome 浏览器控制（通过 CDP 连接；默认禁用）。
  # 开启后可帮用户打开网页、搜索、点击及控制视频播放/暂停。
  browser:
    enabled: false
    cdp_url: http://127.0.0.1:9222
    auto_launch: true          # 调试端口未监听时自动拉起独立 Chrome 进程
    executable_path: null      # 留空自动探测本机 Chrome
    user_data_dir: ./data/browser-profile   # 独立配置目录，保留登录态
    timeout: 30
    max_read_chars: 12000
    allowed_domains: []        # 空表示允许访问任意 http/https 网址

# ---------------------------------------------------------------- 工作区文件系统
# 所有文件类工具的读写都被钉在这个目录里
# （`resolve()` 之后再校验，软链接也逃不出去）。
filesystem:
  root_dir: ./data/workspace

# ---------------------------------------------------------------- 上下文管理
context:
  summarization: true        # 早期历史超阈值时压成摘要（**原文不删**）
  keep_recent_messages: 12       # 压缩时始终保留的最近消息条数
  offload_large_results: true    # 超大工具结果落盘，上下文里只留预览 + 路径
  offload_threshold_bytes: 20000
  # 需要任务清单时把条目写进工作区文件，模型能看到、人也能改。
  # ---- 这三个数决定「窗口有多大」 ----
  # 送进模型的历史 token 预算。**最关键的一个数**：
  # 默认 80000 刻意保守（成本可预期）；100 万上下文的大模型应该调高。
  max_input_tokens: 80000
  # 用量超过预算的这个比例时触发压缩
  summarize_threshold_ratio: 0.7
  # 卸载目录；默认 <filesystem.root_dir>/.offload。
  # 必须落在工作区内 —— 否则模型读不回来，卸载等于丢弃。
  offload_dir: null
  # 注入系统提示词的记忆上限（记忆每轮都带，必须精简）
  max_memory_chars: 8000

# ---------------------------------------------------------------- 存储
storage:
  database_url: sqlite+aiosqlite:///./data/doudou.db
  # 会话历史存哪：database = 落库（重启可续）；memory = 只在进程内
  history: database
  # 库里保留的消息条数（**保留**，不是送进模型的窗口 —— 后者由 context 决定）
  max_messages_per_thread: 500
  echo_sql: false

# ---------------------------------------------------------------- MCP
mcp:
  enabled: true
  # 启动时拉取工具；失败是否阻塞启动
  fail_fast: false
  tool_name_prefix: true    # 给 MCP 工具加 server 前缀，避免重名
  call_timeout: 60
  # 被各 server 继承；server 里显式写过的值优先。
  defaults:
    enabled: true
    timeout: 60
    retries: 1
    read_only: false
  # server 清单就写在这里（不再单独一个 mcp.servers.yaml）。
  # transport 决定必填字段：stdio → command；http / sse → url。
  # 支持 ${ENV_VAR} 占位（密钥留在 .env）；变量没设置会**直接报错**。
  # 第三方 server 默认按「有副作用」处理（每次调用都要人工确认），
  # 确认只读后写 read_only: true 才免逐次确认。
  # 代价：适配器的 MCP 工具是无状态的，每次调用都新建 session（stdio 就是重新拉起
  # 子进程，npx/uvx 那类到秒级）；需要频繁调用优先用 http。
  servers: []
  # 例：
  #   - name: filesystem
  #     transport: stdio
  #     command: npx
  #     args: ["-y", "@modelcontextprotocol/server-filesystem", "./data/workspace"]
  #     exclude_tools: [delete_path]
  #     read_only: false
  #     description: 本地文件读写
  #   - name: github
  #     transport: http
  #     url: https://api.githubcopilot.com/mcp/
  #     headers:
  #       Authorization: "Bearer ${GITHUB_TOKEN}"
  #     include_tools: [search_repositories, get_file_contents]
  #     description: GitHub 只读查询

# ---------------------------------------------------------------- 通道
channels:
  cli:
    enabled: true

  feishu:
    enabled: false
    # websocket = 主动连出去收事件（无需公网地址，推荐）
    # callback  = HTTP 事件回调（需要公网 HTTPS、验签解密，尚未实现）
    mode: websocket
    base_url: https://open.feishu.cn
    bot_name: Doudou         # 群聊 @ 判定用，需与飞书里的显示名一致
    # bot_open_id: ou_xxx    # 更可靠的 @ 判定；留空时启动会自动去查
    # app_id / app_secret 从 .env 的 DOUDOU_CHANNELS_FEISHU_APP_ID / DOUDOU_CHANNELS_FEISHU_APP_SECRET 注入
    event_path: /webhooks/feishu/events
    reply_mode: card         # card | text
    stream_reply: true       # 卡片流式更新
    card_update_interval_ms: 800
    allowed_chats: []        # 空表示不限制
    allowed_users: []
    group_require_at: true   # 群聊中必须 @ 机器人才响应
    # false = 同一个群共享一个上下文（群里的助手像一个同事）
    # true  = 按话题（thread_id）拆开
    isolate_by_thread: false
    max_reply_chars: 4000
    dedup_ttl_seconds: 600

  webhook:
    enabled: false
    token_header: X-Doudou-Token

  # 本地常驻语音通道：sherpa-onnx 本地唤醒与断句 + DeepSeek ASR/TTS
  voice:
    enabled: false
    wake_words: ["豆豆"]          # 只有本地听到唤醒词后才会录音并送去识别
    strict_wake_prefix: false     # 设为 true 则要求唤醒词与指令连成一句且出现在转写开头
    wake_homophones: ["豆豆", "逗逗", "都都"]
    command_wait_seconds: 4.0     # 唤醒后等待指令的最大秒数
    silence_duration_seconds: 0.9 # 说完话后静音超过该秒数自动断句
    max_record_seconds: 20.0
    keywords_score: 1.5
    keywords_threshold: 0.25
    vad_threshold: 0.5
    cooldown_seconds: 0.5         # 音箱播报结束后的闭麦冷却秒数
    # api_key: null               # 放 .env 的 DOUDOU_CHANNELS_VOICE_API_KEY（留空回退 DeepSeek Key）
    voice_id: stella              # stella（女声）| tide（男声）
    filter_markdown: true
    input_device: null            # 留空用系统默认麦克风；可用 doudou voice devices 查看编号
    output_device: null           # 留空用系统默认音箱
    models_dir: ./data/models/voice
    auto_download_models: true

# ---------------------------------------------------------------- 可观测性
# 审计 / 成本 / 追踪都挂在同一份事件流上，见 docs/observability.md。
observability:
  metrics:
    enabled: true

  # 审计：每次工具调用一条记录（谁、何时、什么工具、参数摘要、结果、是否经人确认）
  audit:
    enabled: true
    max_arg_chars: 2000        # 单个参数值的长度上限（先打码再截断）
    max_result_chars: 500      # 结果只留开头一段，全文在历史与日志里
    max_rows: 50000            # 落库时的行数上限，超出按时间清理
    # 攒多少条写一次库。1 = 逐条严格持久化（慢但丢得最少）。
    # 默认 50 是为了绕开 SQLite 的单写者瓶颈，见 docs/performance.md。
    batch_size: 50

  # 成本：按天 × 会话累计 token 与费用，超预算只告警（不拦截）
  cost:
    enabled: true
    daily_budget: 0.0          # 0 = 不设预算
    batch_size: 50
    # 价格是部署相关的，因此不写死在代码里。键可以是 provider:model 或模型短名。
    # **没配价格的模型 cost 记为 null（未知 ≠ 0）**，并在 /usage 的 unknown_models 里列出。
    prices:
      default: {input: 0.0, output: 0.0}
      # openai:gpt-x: {input: 3.0, output: 15.0}   # 每 100 万 token

  # 轨迹：一次运行一行，步骤明细存 JSON。是 /traces 与 /stats 的数据源。
  # **本地落库，不发送到任何外部服务**，所以默认开；用 max_rows 压住增长、
  # max_text_chars 截断单段文本（轨迹是可重建的派生数据，放心压制）。
  traces:
    enabled: true
    max_rows: 20000            # 行数上限，超出按时间清理
    max_text_chars: 1000       # 单段文本（步骤文本/工具结果）截断长度
    batch_size: 50             # 攒批写：1 = 逐条严格持久化

# ---------------------------------------------------------------- 定时任务
# 在聊天里让 Agent 建任务（schedule_* 工具）；到点由 serve 进程过一遍 LLM，
# 把结果推到目标会话。**任务不绑定会话**，只记投递目标：
#   飞书群 → 那个群；飞书私聊 → 那条私聊；CLI / Web → 飞书私聊（触发时解析）。
scheduler:
  enabled: true
  tick_seconds: 30.0           # 轮询间隔；到点任务的最小精度就是它
  timezone: null               # 解释 cron/间隔用的时区；null 继承 runtime.timezone
  max_tasks: 200               # 任务数上限，超出时拒绝新建
  run_timeout_seconds: 600.0   # 单次触发的最长运行时间；超时记为失败
  # CLI/Web 建的任务推给谁的飞书私聊：填飞书 open_id。
  # 留空时只能靠「唯一一条私聊绑定」推断，多用户场景请显式配置。
  owner_user_id: null
  catch_up: false              # 停机期间错过的触发点是否补跑（默认不补）
