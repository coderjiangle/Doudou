# ============================================================================
# Doudou 主配置模板
# 复制为 config/config.yaml 后按需修改。
# 优先级：环境变量 > 本文件 > 代码内默认值（见 doudou.config.loader）
# 密钥类字段一律不要写在这里，放到 .env。
# ============================================================================

version: 1

# ---------------------------------------------------------------- 运行环境
runtime:
  env: local                 # local | dev | prod
  debug: true
  log_level: INFO
  log_json: false            # prod 建议 true
  timezone: Asia/Shanghai

server:
  host: 127.0.0.1
  port: 8000
  base_path: /api/v1
  workers: 1
  cors_origins:
    - http://localhost:5173
  # api_token 从环境变量 DOUDOU_API_TOKEN 读取，不在此处配置

# ---------------------------------------------------------------- 模型
model:
  # provider:model 形式；也可写多行 fallback，第一个为主模型
  primary: openai:gpt-5.5
  fallbacks: []
  temperature: 0.2
  max_tokens: 4096
  timeout: 120
  max_retries: 2
  # 供自建/兼容网关使用
  base_url: null

# ---------------------------------------------------------------- Agent
agent:
  name: Doudou
  system_prompt_file: prompts/system.md   # 相对 config/ 目录；留空则用内置默认提示词
  memory_files:
    - AGENTS.md                            # deepagents memory=，始终加载
  skills:
    - ../skills/                           # Agent Skills 根目录
  subagents_file: agents.yaml
  # 需要人工确认（LangGraph interrupt）的工具
  interrupt_on:
    write_file: true
    edit_file: true
    delete: true
    shell_exec: true
  # 单次运行的步数上限，防止死循环
  recursion_limit: 60
  # 文件系统权限规则，按顺序首匹配生效
  permissions:
    - operations: [read, write]
      paths: ["/workspace/**"]
      mode: allow
    - operations: [read, write]
      paths: ["/**/.env", "/**/*.pem", "/**/*.key", "/**/secrets/**"]
      mode: deny

# ---------------------------------------------------------------- 工具
tools:
  # 空列表 = 全部启用；填分组名则只启用这些。分组：web / http / files / notes / clock
  enabled_groups: []
  # 逐个禁用的工具名，优先级高于 enabled_groups
  disabled: []

  # 联网检索（Tavily）。缺少 TAVILY_API_KEY 时该分组整组不注册 ——
  # 「永远失败的工具」只会占提示词并诱导模型乱试。
  web_search:
    provider: tavily
    max_results: 5
    search_depth: basic        # basic | advanced（更准但更慢更贵）
    include_answer: true
    timeout: 20

  # 出站 HTTP。**默认拒绝一切**：allowed_domains 为空时工具不注册。
  # - example.com   匹配 example.com 及其任意子域
  # - *.example.com 只匹配子域
  # 此外解析到内网/回环地址的域名一律拒绝（防 SSRF 绕过）。
  http:
    allowed_domains: []
    timeout: 20
    max_response_chars: 20000
    max_redirects: 2
    user_agent: Doudou/0.1 (+personal-assistant)

  # 只读文件访问。根目录固定为 filesystem.root_dir，不单独配置。
  files:
    max_read_chars: 50000
    max_list: 200

  # 本地笔记（Markdown）。note_save 有副作用，默认需要人工确认。
  notes:
    directory: ./data/notes
    max_list: 50
    max_read_chars: 20000

# ---------------------------------------------------------------- 虚拟文件系统
filesystem:
  backend: composite         # state | store | filesystem | composite
  root_dir: ./data/workspace
  virtual_mode: true
  # composite 模式下：以这些前缀开头的路径落到本地磁盘，其余放内存
  routes:
    - prefix: /workspace/
      backend: filesystem
    - prefix: /
      backend: state

# ---------------------------------------------------------------- 上下文管理
context:
  todo_list: true            # 启用 write_todos
  summarization: true
  summarize_after_messages: 40
  keep_recent_messages: 12
  offload_large_results: true
  offload_threshold_bytes: 20000

# ---------------------------------------------------------------- 存储
storage:
  database_url: sqlite+aiosqlite:///./data/doudou.db
  # 会话历史存哪：database = 落库（重启可续）；memory = 只在进程内
  history: database
  checkpointer: sqlite       # memory | sqlite | postgres
  store: sqlite              # memory | sqlite | postgres
  echo_sql: false

# ---------------------------------------------------------------- MCP
mcp:
  enabled: true
  config_file: mcp.servers.yaml
  # 启动时拉取工具；失败是否阻塞启动
  fail_fast: false
  tool_name_prefix: true    # 给 MCP 工具加 server 前缀，避免重名
  call_timeout: 60

# ---------------------------------------------------------------- 通道
channels:
  cli:
    enabled: true

  feishu:
    enabled: false
    # websocket = 主动连出去收事件（无需公网地址，推荐）
    # callback  = HTTP 事件回调（需要公网 HTTPS、验签解密，尚未实现）
    mode: websocket
    base_url: https://open.feishu.cn
    bot_name: Doudou         # 群聊 @ 判定用，需与飞书里的显示名一致
    # bot_open_id: ou_xxx    # 更可靠的 @ 判定；留空时启动会自动去查
    # app_id / app_secret 从 .env 的 FEISHU_APP_ID / FEISHU_APP_SECRET 注入
    event_path: /webhooks/feishu/events
    reply_mode: card         # card | text
    stream_reply: true       # 卡片流式更新
    card_update_interval_ms: 800
    allowed_chats: []        # 空表示不限制
    allowed_users: []
    group_require_at: true   # 群聊中必须 @ 机器人才响应
    # false = 同一个群共享一个上下文（群里的助手像一个同事）
    # true  = 按话题（thread_id）拆开
    isolate_by_thread: false
    max_reply_chars: 4000
    dedup_ttl_seconds: 600

  webhook:
    enabled: false
    token_header: X-Doudou-Token

# ---------------------------------------------------------------- 可观测性
observability:
  langsmith:
    enabled: false
    project: doudou
  otel:
    enabled: false
    endpoint: null
  metrics:
    enabled: true
