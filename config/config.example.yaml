# ============================================================================
# Doudou 主配置模板
# 复制为 config/config.yaml 后按需修改。
# 优先级：环境变量 > 本文件 > 代码内默认值（见 doudou.config.loader）
# 密钥类字段一律不要写在这里，放到 .env。
# ============================================================================

version: 1

# ---------------------------------------------------------------- 运行环境
runtime:
  env: local                 # local | dev | prod
  debug: true
  log_level: INFO
  log_json: false            # prod 建议 true
  timezone: Asia/Shanghai

server:
  host: 127.0.0.1
  port: 8000
  base_path: /api/v1
  workers: 1
  cors_origins:
    - http://localhost:5173
  # api_token 从环境变量 DOUDOU_API_TOKEN 读取，不在此处配置

# ---------------------------------------------------------------- 模型
model:
  # provider:model 形式；也可写多行 fallback，第一个为主模型
  primary: openai:gpt-5.5
  fallbacks: []
  temperature: 0.2
  max_tokens: 4096
  timeout: 120
  max_retries: 2
  # 供自建/兼容网关使用
  base_url: null

# ---------------------------------------------------------------- Agent
agent:
  name: Doudou
  system_prompt_file: prompts/system.md   # 相对 config/ 目录；留空则用内置默认提示词
  memory_files:
    - AGENTS.md                            # 启动时读进系统提示词；助手可用 remember 回写
  skills:
    - ../skills/                           # Agent Skills 根目录
  # 提示词里最多列出几个技能。索引必须**有界**：技能一多，
  # 光是索引就能把提示词顶坏（超出时会说明「另有 X 个未列出」）。
  skill_index_limit: 40
  subagents_file: agents.yaml
  # 手工覆盖「哪些工具需要人工确认」。通常不需要写 ——
  # 工具自己用 `side_effects=True` 声明（写文件、写笔记、执行命令都会自动被拦）。
  # 这里只在两处有用：**关掉**某个工具的确认，或**额外加上**一个。
  interrupt_on:
    # workspace_delete: false   # 例如：删除也信任它（不推荐）
    # shell_exec: true          # 默认已由 side_effects 覆盖，写在这里只是显式化
  # 单次运行的步数上限，防止死循环
  recursion_limit: 60
  # 等待人工确认的时长（秒）。等不到就按**拒绝**处理 ——
  # 悬着的确认等于没有确认，默认必须偏向安全的一侧。
  approval_timeout_seconds: 300
  # 路径权限规则，按顺序**首匹配生效**，没有匹配到任何规则时**放行**。
  # 匹配的是相对工作区、以 / 开头的 POSIX 路径；工具层已经保证「跑不出工作区」，
  # 这里是更细的限制。想「默认拒绝」就加一条 `paths: ["/**"], mode: deny` 放在最后。
  permissions:
    - operations: [read, write]
      paths: ["/**/.env", "/**/*.pem", "/**/*.key", "/**/secrets/**"]
      mode: deny

# ---------------------------------------------------------------- 工具
tools:
  # 空列表 = 全部启用；填分组名则只启用这些。
  # 分组：web / http / files / notes / shell / skills / memory / clock / delegation
  enabled_groups: []
  # 逐个禁用的工具名，优先级高于 enabled_groups
  disabled: []

  # 联网检索（Tavily）。缺少 TAVILY_API_KEY 时该分组整组不注册 ——
  # 「永远失败的工具」只会占提示词并诱导模型乱试。
  web_search:
    provider: tavily
    max_results: 5
    search_depth: basic        # basic | advanced（更准但更慢更贵）
    include_answer: true
    timeout: 20

  # 出站 HTTP。**默认拒绝一切**：allowed_domains 为空时工具不注册。
  # - example.com   匹配 example.com 及其任意子域
  # - *.example.com 只匹配子域
  # 此外解析到内网/回环地址的域名一律拒绝（防 SSRF 绕过）。
  http:
    allowed_domains: []
    timeout: 20
    max_response_chars: 20000
    max_redirects: 2
    user_agent: Doudou/0.1 (+personal-assistant)

  # 工作区文件读写。根目录固定为 filesystem.root_dir，不单独配置。
  # 写类工具（workspace_write / workspace_edit / workspace_delete）声明了副作用，
  # 默认每次调用都要人工确认，并且还会过上面 agent.permissions 的路径规则。
  files:
    max_read_chars: 50000
    max_list: 200
    max_write_chars: 200000

  # 命令执行：**默认禁用**。这是唯一没有路径约束机制的出口 ——
  # 权限规则拦不住 `rm -rf /`，只有人工确认这一道。需要真正隔离请用容器/沙箱。
  shell:
    enabled: false
    cwd: null                  # 缺省取 filesystem.root_dir
    timeout: 60
    max_output_chars: 20000
    # 只透传白名单里的环境变量，避免把 *_API_KEY 交给子进程
    inherit_env: ["PATH", "HOME", "LANG", "LC_ALL", "TZ", "TEMP", "TMP"]

  # 本地笔记（Markdown）。note_save 有副作用，默认需要人工确认。
  notes:
    directory: ./data/notes
    max_list: 50
    max_read_chars: 20000

# ---------------------------------------------------------------- 虚拟文件系统
# 目前只有 root_dir 生效：所有文件类工具的读写都被钉在这个目录里
# （`resolve()` 之后再校验，软链接也逃不出去）。
filesystem:
  root_dir: ./data/workspace
  # 下面三个字段**未使用**，原本是「接入 deepagents 的虚拟文件系统」的配置项，
  # 该计划已取消（见 docs/roadmap.md 修正记录 #3）。这里不列出来，避免误导。
  # 兼容大型配置文件的用户可以在自己的 config.yaml 里保留它们，不会报错。

# ---------------------------------------------------------------- 上下文管理
context:
  summarization: true        # 早期历史超阈值时压成摘要（**原文不删**）
  summarize_after_messages: 40   # 次要触发条件：条数超过它时也考虑压缩
  keep_recent_messages: 12       # 压缩时始终保留的最近消息条数
  offload_large_results: true    # 超大工具结果落盘，上下文里只留预览 + 路径
  offload_threshold_bytes: 20000
  # 注：context.todo_list 未使用（原为 deepagents 的 write_todos 预留，计划已取消）。
  # 需要任务清单时现在用 note_* 工具写进工作区/笔记，模型能看到、人也能改。
  # ---- M7 新增：这三个数决定「窗口有多大」 ----
  # 送进模型的历史 token 预算。**最关键的一个数**：
  # 默认 80000 刻意保守（成本可预期）；100 万上下文的大模型应该调高。
  max_input_tokens: 80000
  # 用量超过预算的这个比例时触发压缩
  summarize_threshold_ratio: 0.7
  # 卸载目录；默认 <filesystem.root_dir>/.offload。
  # 必须落在工作区内 —— 否则模型读不回来，卸载等于丢弃。
  offload_dir: null
  # 注入系统提示词的记忆上限（记忆每轮都带，必须精简）
  max_memory_chars: 8000

# ---------------------------------------------------------------- 存储
storage:
  database_url: sqlite+aiosqlite:///./data/doudou.db
  # 会话历史存哪：database = 落库（重启可续）；memory = 只在进程内
  history: database
  # 库里保留的消息条数（**保留**，不是送进模型的窗口 —— 后者由 context 决定）
  max_messages_per_thread: 500
  checkpointer: sqlite       # memory | sqlite | postgres
  store: sqlite              # memory | sqlite | postgres
  echo_sql: false

# ---------------------------------------------------------------- MCP
mcp:
  enabled: true
  config_file: mcp.servers.yaml
  # 启动时拉取工具；失败是否阻塞启动
  fail_fast: false
  tool_name_prefix: true    # 给 MCP 工具加 server 前缀，避免重名
  call_timeout: 60

# ---------------------------------------------------------------- 通道
channels:
  cli:
    enabled: true

  feishu:
    enabled: false
    # websocket = 主动连出去收事件（无需公网地址，推荐）
    # callback  = HTTP 事件回调（需要公网 HTTPS、验签解密，尚未实现）
    mode: websocket
    base_url: https://open.feishu.cn
    bot_name: Doudou         # 群聊 @ 判定用，需与飞书里的显示名一致
    # bot_open_id: ou_xxx    # 更可靠的 @ 判定；留空时启动会自动去查
    # app_id / app_secret 从 .env 的 FEISHU_APP_ID / FEISHU_APP_SECRET 注入
    event_path: /webhooks/feishu/events
    reply_mode: card         # card | text
    stream_reply: true       # 卡片流式更新
    card_update_interval_ms: 800
    allowed_chats: []        # 空表示不限制
    allowed_users: []
    group_require_at: true   # 群聊中必须 @ 机器人才响应
    # false = 同一个群共享一个上下文（群里的助手像一个同事）
    # true  = 按话题（thread_id）拆开
    isolate_by_thread: false
    max_reply_chars: 4000
    dedup_ttl_seconds: 600

  webhook:
    enabled: false
    token_header: X-Doudou-Token

# ---------------------------------------------------------------- 可观测性
# 审计 / 成本 / 追踪都挂在同一份事件流上，见 docs/observability.md。
observability:
  metrics:
    enabled: true

  # 审计：每次工具调用一条记录（谁、何时、什么工具、参数摘要、结果、是否经人确认）
  audit:
    enabled: true
    max_arg_chars: 2000        # 单个参数值的长度上限（先打码再截断）
    max_result_chars: 500      # 结果只留开头一段，全文在历史与日志里
    max_rows: 50000            # 落库时的行数上限，超出按时间清理
    # 攒多少条写一次库。1 = 逐条严格持久化（慢但丢得最少）。
    # 默认 50 是为了绕开 SQLite 的单写者瓶颈，见 docs/performance.md。
    batch_size: 50

  # 成本：按天 × 会话累计 token 与费用，超预算只告警（不拦截）
  cost:
    enabled: true
    daily_budget: 0.0          # 0 = 不设预算
    batch_size: 50
    # 价格是部署相关的，因此不写死在代码里。键可以是 provider:model 或模型短名。
    # **没配价格的模型 cost 记为 null（未知 ≠ 0）**，并在 /usage 的 unknown_models 里列出。
    prices:
      default: {input: 0.0, output: 0.0}
      # openai:gpt-x: {input: 3.0, output: 15.0}   # 每 100 万 token

  # 追踪：Langfuse。默认关闭 —— 把对话内容发到第三方必须是明确的决定。
  # 打开还需 LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY，以及装好 SDK
  # （uv sync --extra tracing）。缺任一条都会安静降级并告警。
  tracing:
    enabled: false
    host: https://cloud.langfuse.com
    environment: null          # prod / staging，会打进 trace 标签
    release: null
    sample_rate: 1.0
    # 下面两个**未使用**（早期预留的 LangSmith / OTel 开关），保留以兼容既有配置
    langsmith:
      enabled: false
      project: doudou
    otel:
      enabled: false
      endpoint: null
