# ============================================================================
# Doudou 本地配置
# 由 config/config.example.yaml 生成，按实际环境调整。
# 优先级：代码内默认值 < 本文件 < DOUDOU_* 环境变量
# 密钥一律放 .env，本文件可以提交（不含任何凭据）。

# AGENTS.md（助手记忆）
# Doudou **自己**的长期记忆。由 `agent.memory_files` 注入系统提示词，**每轮都会带上**，
# 所以只写「跨会话仍然成立」的东西（习惯、称谓、长期项目、明确要求过的偏好），

# ============================================================================

version: 1

# ---------------------------------------------------------------- 运行环境
runtime:
  env: local
  debug: true
  log_level: INFO
  log_json: false              # prod 建议 true
  timezone: Asia/Shanghai      # now 工具的默认时区，也是**日志时间戳**所用时区

server:
  host: 127.0.0.1
  port: 8000
  base_path: /api/v1
  workers: 1

# ---------------------------------------------------------------- 模型
#   OpenAI 兼容协议
#   API Key 从 .env 的 DOUDOU_MODEL_API_KEY 读取（见 agent/models._secret_api_key）
model:
  primary: openai:deepseek-v4.1-flash
  fallbacks: []
  temperature: 0.2
  # 只封顶单次生成，避免「允许生成几十万 token」既慢又贵；
  # 需要长文时用 DOUDOU_MODEL_MAX_TOKENS 临时调高。
  max_tokens: 32768
  # 长文生成会明显超过默认 120s，这里放宽；网关侧若有更短超时会以网关为准。
  timeout: 300
  max_retries: 2
  base_url:
  api_key:

# ---------------------------------------------------------------- Agent
agent:
  name: Doudou
  system_prompt_file: prompts/system.md
  # 助手自己的长期记忆。可以列多个文件（都会注入系统提示词），但**只有第一个**
  # 是 remember 的回写目标；超出 context.max_memory_chars 时从**尾部**截断。
  # 路径按**进程工作目录**解析（与 system_prompt_file / skills 的 config 目录相对不同）。
  # 仓库根的 AGENTS.md 是给编码工具的项目约定，**不**注入助手提示词。
  memory_files:
    - config/AGENTS.md         # 助手记忆：remember 只写这里
  skills:
    - ../skills/               # 仓库根的 skills/ 目录
  # 提示词里最多列几个技能。索引必须**有界**，
  # 否则技能一多、光是索引就把提示词顶坏。
  skill_index_limit: 40
  # 需要人工确认的工具：CLI 会先询问再执行（见 docs/security.md）
  interrupt_on:
    write_file: true
    edit_file: true
    delete: true
    shell_exec: true
    # 浏览器常规交互（默认有副作用）：为让上网与看视频流程连贯，这里免去逐次确认；
    # 如需操作前询问，把对应项改成 true 或删掉即可。
    browser_click: false
    browser_type: false
    browser_press_key: false
    browser_close_tab: false
  max_steps: 20                # ReAct 循环单次运行的最大步数（模型往返次数）
  max_tool_calls_per_step: 8
  # 多轮防人设漂移：每隔 N 轮用户消息（及摘要压缩后）在用户消息后固化一次锚点并落库，
  # 使前缀完全一致、Prefix Cache 100% 命中；历史接口与飞书展示会自动剥离该标记。
  persona_reminder: "请始终保持豆豆（中华田园犬）的口吻和对应家人态度，正事说准，禁止变成普通AI客服套话。"
  persona_reminder_interval: 5
  # 续聊旧会话时，若已跨天或距上次对话超过该小时数，固化一条 [时间上下文] 并落库（0 表示关闭）
  time_context_gap_hours: 4.0
  # 文件系统路径权限；顺序即匹配顺序，拒绝规则要写在前面
  # 文件系统路径权限。**首匹配生效**，所以拒绝规则必须写在放行规则前面。
  # 匹配的是相对工作区的 POSIX 路径（以 / 开头）：
  #   /**          工作区里任何路径（含子目录）
  #   /**/.env     任何目录下的 .env（含根目录）
  #   /secrets/**  secrets 目录及其下所有内容
  # 注意：工具层已经保证「跑不出工作区」，这里是更细的限制。
  # 没有匹配任何规则时**放行**；想「默认拒绝」就加一条 `paths: ["/**"], mode: deny` 放最后。
  permissions:
    - operations: [read, write]
      paths: ["/**/.env", "/**/*.pem", "/**/*.key", "/**/secrets/**"]
      mode: deny
  # 子 Agent 定义：被 tools/builtin/delegation.py 读取，生成 `task` 工具的可选项。
  # 子 Agent 有独立的上下文窗口，看不到主对话，所以 description 与 prompt 必须自洽。
  # 工具名必须是**实际装载**的工具（用 `doudou tools list` 查）。
  subagents:
    - name: researcher
      description: 联网检索与资料汇总，产出带来源的结构化调研结论；名字为黑豆的德牧狗，很忠诚。
      prompt: |
        你是「黑豆」，一只忠诚稳重、执行力强的德牧犬，也是豆豆老大麾下的资料研究员，负责检索、比对与汇总。

        风格要求：
        - 汇报时保持「黑豆」的忠诚干练口吻（例如开头可简短向「豆豆老大」报到，结尾简洁干脆），不油腻、不喧宾夺主。

        工作要求：
        - 给出结论时必须标注来源链接；严格区分事实与推断，推断要显式标注。
        - 无法确认的部分写「未确认」，绝不编造。
        - 只回传结构化调研结论（要点 + 来源），不要贴大段原始网页内容。
      tools:
        - web_search
        - http_request
        - workspace_read
        - now
      max_steps: 20

    - name: planner
      description: 把模糊目标拆解为可执行步骤与验收标准；名字为白豆的金毛狗，很机敏。
      prompt: |
        你是「白豆」，一只机敏细心、条理分明的金毛犬，也是豆豆老大麾下的任务规划师。

        风格要求：
        - 用「白豆」向「豆豆老大」汇报方案的机敏口吻组织语言（开头可一句话利落表态），保持清晰克制，不废话、不卖萌过度。

        输出必须包含：
        - 目标复述与前提假设
        - 步骤清单（标明依赖关系）
        - 每步的验收标准
        - 主要风险与未知项

        不要执行任务本身，只做规划。除了上述规划报告外，不要回传无关闲聊或额外内容。
      # 规划不需要工具：给它工具只会让它越过规划直接动手。
      tools: []
      max_steps: 3

    # 需要操作系统能力时再启用（并先在 tools.shell.enabled 打开）。
    - name: coder
      description: 编写、修改与调试代码，可执行命令并跑测试；名字为金豆的边牧狗，很聪明。
      prompt: |
        你是「金豆」，一只聪明敏锐、严谨务实的边牧犬，也是豆豆老大麾下的软件工程助手，负责代码实现与排错。

        风格要求：
        - 以「金豆」向「豆豆老大」汇报的聪明干练口吻作答，先给结论再列细节，条理清楚。

        工作要求：
        - 改动最小化；改完必须运行相关测试并如实汇报结果。
        - 说明具体改动点、验证情况与潜在风险，未运行或未确认的事项如实写明。
      tools:
        - workspace_read
        - workspace_list
        - workspace_write
        - workspace_edit
        - shell_exec
      max_steps: 12

# ---------------------------------------------------------------- 工具
tools:
  # 空列表 = 全部启用；填分组名则只启用这些。
  # 分组：web / http / browser / files / shell / skills / memory / clock / delegation
  enabled_groups: []
  # 逐个禁用的工具名，优先级高于 enabled_groups
  disabled: []

  # web_search（tavily | deepseek）：key 统一由 DOUDOU_TOOLS_WEB_SEARCH_API_KEY 提供
  web_search:
    provider: deepseek
    api_key: ""
    max_results: 5
    search_depth: basic        # 仅 tavily：basic | advanced
    include_answer: true       # 仅 tavily：附带摘要答案
    need_content: true        # 仅 deepseek：返回网页正文
    timeout: 20

  # http_request：**默认拒绝一切出站请求**，allowed_domains 为空时工具不注册。
  # example.com 同时匹配其子域；*.example.com 只匹配子域。
  http:
    allowed_domains: []
    # 常用域名可先放进来，例如：
    # - docs.python.org
    # - api.github.com
    timeout: 20
    max_response_chars: 20000
    max_redirects: 2

  # 工作区文件（读写一体）。写类工具默认需要人工确认，且要过 agent.permissions
  files:
    max_read_chars: 50000
    max_list: 200
    # 单次写入（或替换后）的字符上限
    max_write_chars: 200000

  # 命令执行：**默认禁用**。这是唯一没有路径约束机制的出口
  # （权限规则拦不住 `rm -rf /`），只有人工确认这一道。
  # 需要真正隔离请用容器/沙箱，而不是靠这个工具。
  shell:
    enabled: true
    # "" = 不隔离；"bwrap" = bubblewrap 沙箱（仅 Linux，需安装 bubblewrap）
    sandbox: ""
    timeout: 60
    max_output_chars: 20000

  # 本机 Google Chrome 控制（CDP 连接；未启动时按需拉起独立 Chrome 窗口并保留登录态）
  browser:
    enabled: true
    cdp_url: http://127.0.0.1:9222
    auto_launch: true
    executable_path: null
    user_data_dir: ./data/browser-profile
    timeout: 30
    max_read_chars: 12000
    allowed_domains: []

# ---------------------------------------------------------------- 工作区文件系统
filesystem:
  # 所有文件类工具都被钉在这个目录里（resolve 之后再校验，软链接也逃不出去）
  root_dir: ./data/workspace

# ---------------------------------------------------------------- 上下文管理
context:
  summarization: true          # 早期历史超阈值时压成摘要（原文不删）
  # 压缩时始终保留的最近消息条数（它们对当前对话最相关）
  keep_recent_messages: 12
  offload_large_results: true
  offload_threshold_bytes: 20000
  # ---- 上下文预算与卸载 ----
  # 送进模型的历史 token 预算。**这是最关键的一个数**：
  # 默认值刻意保守（成本可预期），大上下文模型应该调高。
  max_input_tokens: 1000000
  # 用量超过预算的这个比例时触发压缩（0–1）
  summarize_threshold_ratio: 0.7
  # 卸载目录。默认 <filesystem.root_dir>/.offload
  # 必须落在工作区内，否则模型拿不到路径也读不回来。
  offload_dir: null
  # 注入系统提示词的记忆上限（记忆每轮都带，必须精简）
  max_memory_chars: 8000

# ---------------------------------------------------------------- 存储
storage:
  database_url: sqlite+aiosqlite:///./data/doudou.db
  history: database
  # 单个会话在库里保留的消息条数（**保留**，不是送进模型的窗口）。
  # 保留得多一些是有意的：压缩是有损的，原始历史要能回溯。
  max_messages_per_thread: 500
  echo_sql: false

# ---------------------------------------------------------------- MCP
mcp:
  enabled: true
  fail_fast: false
  tool_name_prefix: true
  call_timeout: 60
  # 被各 server 继承；**server 里显式写过的值优先**。
  defaults:
    enabled: true
    timeout: 60
    retries: 1
    read_only: false
  # server 清单直接写在这里。transport 决定必填字段：
  #   stdio  → command（+ args）
  #   http   → url（Streamable HTTP）
  #   sse    → url
  # 支持 ${ENV_VAR} 占位，密钥留在 .env；**变量没设置会直接报错**。
  # 第三方 server 默认按「有副作用」处理（每次调用都要人工确认）；
  # 确认它确实只读后写 read_only: true 才免逐次确认。
  #
  # 一个必须知道的代价：适配器的 MCP 工具是**无状态**的，每次调用都会新建一个
  # session —— 对 stdio 而言就是每次调用都重新拉起子进程（npx/uvx 那类到秒级）。
  # 需要频繁调用的能力优先用 http。
  servers: []
  # 需要时按下面这份模板加项（把 enabled 改成 true）：
  #
  # servers:
  #   - name: filesystem
  #     enabled: true
  #     transport: stdio
  #     command: npx
  #     args: ["-y", "@modelcontextprotocol/server-filesystem", "./data/workspace"]
  #     env:
  #       NODE_NO_WARNINGS: "1"
  #     exclude_tools: [delete_path]
  #     read_only: false
  #     description: 本地文件读写
  #
  #   - name: github
  #     enabled: true
  #     transport: http
  #     url: https://api.githubcopilot.com/mcp/
  #     headers:
  #       Authorization: "Bearer ${GITHUB_TOKEN}"
  #     include_tools: [search_repositories, get_file_contents]
  #     description: GitHub 只读查询
  #
  #   - name: fetch
  #     enabled: true
  #     transport: stdio
  #     command: uvx
  #     args: ["mcp-server-fetch"]
  #     description: 网页抓取

# ---------------------------------------------------------------- 通道
channels:
  cli:
    enabled: true

  feishu:                      # WebSocket 长连接
    enabled: false
    mode: websocket            # websocket（推荐，无需公网）| callback（未实现）
    base_url: https://open.feishu.cn
    bot_name: 豆豆助手           # 群聊 @ 判定用，需与飞书里的显示名一致
    # bot_open_id:       # 更可靠的 @ 判定；留空时启动会自动获取
    # app_id / app_secret 从 .env 的 DOUDOU_CHANNELS_FEISHU_APP_ID / DOUDOU_CHANNELS_FEISHU_APP_SECRET 注入
    reply_mode: card           # card（流式卡片）| text
    stream_reply: true
    card_update_interval_ms: 800
    allowed_chats: []          # 非空即启用白名单
    allowed_users: []
    group_require_at: true     # 群里必须 @ 机器人才响应
    isolate_by_thread: false   # false = 同一个群共享一个上下文
    max_reply_chars: 4000
    dedup_ttl_seconds: 600

  webhook:
    enabled: false
    token_header: X-Doudou-Token

  # 本地常驻语音（sherpa-onnx 本地唤醒词 + Silero VAD + DeepSeek ASR/WebSocket TTS）
  voice:
    enabled: true
    wake_words: ["豆豆"]
    strict_wake_prefix: false
    wake_homophones: ["豆豆", "逗逗", "都都"]
    command_wait_seconds: 4.0
    silence_duration_seconds: 0.9
    max_record_seconds: 20.0
    keywords_score: 1.5
    keywords_threshold: 0.25
    vad_threshold: 0.5
    cooldown_seconds: 0.5
    voice_id: stella
    filter_markdown: true
    input_device: null
    output_device: null
    models_dir: ./data/models/voice
    auto_download_models: true

# ---------------------------------------------------------------- 可观测性
# 审计 / 成本 / 追踪（见 docs/observability.md）
observability:
  metrics:
    enabled: true
  audit:
    enabled: true
    batch_size: 50             # 攒批写：1 = 逐条严格持久化（SQLite 下慢很多）
    max_rows: 50000
  cost:
    enabled: true
    daily_budget: 0.0          # 0 = 不设；超了只告警
    batch_size: 50
    # 你的网关价格。没配 → cost 记为 null（未知 ≠ 0），并在 /usage 里列出 unknown_models
    prices:
      default: {input: 0.0, output: 0.0}
  traces:
    enabled: true              # 运行轨迹落库（run_traces 表），供 /traces 与 /stats 使用
    max_rows: 20000            # 行数上限，超出按时间清理
    max_text_chars: 1000       # 单段文本（步骤文本/工具结果）截断长度
    batch_size: 50

# 定时任务（在聊天里用 schedule_* 工具管理；由 serve 进程到点触发）
scheduler:
  enabled: true
  tick_seconds: 30.0
  timezone: null               # null = 用 runtime.timezone
  owner_user_id: null          # CLI/Web 任务的飞书私聊归属（open_id）
