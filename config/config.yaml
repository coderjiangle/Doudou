# ============================================================================
# Doudou 本地配置
# 由 config/config.example.yaml 生成，按实际环境调整。
# 优先级：本文件 < config/config.local.yaml < DOUDOU_* 环境变量
# 密钥一律放 .env，本文件可以提交（不含任何凭据）。
# ============================================================================

version: 1

# ---------------------------------------------------------------- 运行环境
runtime:
  env: local
  debug: true
  log_level: INFO
  log_json: false              # prod 建议 true
  timezone: Asia/Shanghai      # now 工具的默认时区

server:
  host: 127.0.0.1
  port: 8000
  base_path: /api/v1
  workers: 1

# ---------------------------------------------------------------- 模型
# 供应商：himodels 网关（OpenAI 兼容协议）
#   base_url 指向网关，provider 用 openai
#   API Key 从 .env 的 OPENAI_API_KEY 读取（见 model.models._secret_api_key）
model:
  primary: openai:deepseek-flash-official
  fallbacks: []
  temperature: 0.2
  # 该模型输出上限为 384000 token（上下文 1000000），但把 max_tokens 设成上限
  # 意味着「允许单次生成 38 万 token」——既慢又贵。这里只封顶单次生成，
  # 需要长文时再临时调高（或走 DOUDOU_MODEL__MAX_TOKENS 覆盖）。
  max_tokens: 16384
  # 长文生成会明显超过默认 120s，这里放宽；网关侧若有更短超时会以网关为准。
  timeout: 300
  max_retries: 2
  base_url: https://api.himodels.ai/v1

# ---------------------------------------------------------------- Agent
agent:
  name: Doudou
  system_prompt_file: prompts/system.md
  memory_files:
    - AGENTS.md                # M7 接入记忆后生效
  skills:
    - ../skills/               # 仓库根的 skills/ 目录
  # 提示词里最多列几个技能。索引必须**有界**，
  # 否则技能一多、光是索引就把提示词顶坏。
  skill_index_limit: 40
  subagents_file: agents.yaml  # M8 接入子 Agent 后生效
  # 需要人工确认的工具：CLI 会先询问再执行（见 docs/security.md）
  interrupt_on:
    write_file: true
    edit_file: true
    delete: true
    shell_exec: true
  recursion_limit: 60          # 未使用（原为接入 deepagents 预留，计划已取消）
  max_steps: 10                # ReAct 循环单次运行的最大步数（模型往返次数）
  max_tool_calls_per_step: 8
  # M8 落地文件系统工具后生效；顺序即匹配顺序，拒绝规则要写在前面
  # 文件系统路径权限。**首匹配生效**，所以拒绝规则必须写在放行规则前面。
  # 匹配的是相对工作区的 POSIX 路径（以 / 开头）：
  #   /**          工作区里任何路径（含子目录）
  #   /**/.env     任何目录下的 .env（含根目录）
  #   /secrets/**  secrets 目录及其下所有内容
  # 注意：工具层已经保证「跑不出工作区」，这里是更细的限制。
  # 没有匹配任何规则时**放行**；想「默认拒绝」就加一条 `paths: ["/**"], mode: deny` 放最后。
  permissions:
    - operations: [read, write]
      paths: ["/**/.env", "/**/*.pem", "/**/*.key", "/**/secrets/**"]
      mode: deny

# ---------------------------------------------------------------- 工具
tools:
  # 空列表 = 全部启用；填分组名则只启用这些。
  # 分组：web / http / files / notes / shell / skills / memory / clock / delegation
  enabled_groups: []
  # 逐个禁用的工具名，优先级高于 enabled_groups
  disabled: []

  # web_search（Tavily）：缺少 TAVILY_API_KEY 时该分组整组不注册
  web_search:
    provider: tavily
    max_results: 5
    search_depth: basic        # basic | advanced（更准但更慢更贵）
    include_answer: true
    timeout: 20

  # http_request：**默认拒绝一切出站请求**，allowed_domains 为空时工具不注册。
  # example.com 同时匹配其子域；*.example.com 只匹配子域。
  http:
    allowed_domains: []
    # 常用域名可先放进来，例如：
    # - docs.python.org
    # - api.github.com
    timeout: 20
    max_response_chars: 20000
    max_redirects: 2

  # 工作区文件（读写一体）。写类工具默认需要人工确认，且要过 agent.permissions
  files:
    max_read_chars: 50000
    max_list: 200
    # 单次写入（或替换后）的字符上限
    max_write_chars: 200000

  # 本地笔记；写笔记有副作用，默认需要人工确认
  notes:
    directory: ./data/notes
    max_list: 50
    max_read_chars: 20000

  # 命令执行：**默认禁用**。这是唯一没有路径约束机制的出口
  # （权限规则拦不住 `rm -rf /`），只有人工确认这一道。
  # 需要真正隔离请用容器/沙箱，而不是靠这个工具。
  shell:
    enabled: false
    timeout: 60
    max_output_chars: 20000

# ---------------------------------------------------------------- 虚拟文件系统
filesystem:
  # 所有文件类工具都被钉在这个目录里（resolve 之后再校验，软链接也逃不出去）
  root_dir: ./data/workspace
  # 以下字段未使用（原为 deepagents 的虚拟文件系统预留，计划已取消），
  # 保留只为兼容你的既有配置：backend / virtual_mode / routes
  backend: state
  virtual_mode: true

# ---------------------------------------------------------------- 上下文管理
context:
  todo_list: true              # 未使用（原为 deepagents 的 write_todos 预留）
  summarization: true          # 早期历史超阈值时压成摘要（原文不删）
  # 次要触发条件：消息条数超过它时也考虑压缩
  summarize_after_messages: 40
  # 压缩时始终保留的最近消息条数（它们对当前对话最相关）
  keep_recent_messages: 12
  offload_large_results: true
  offload_threshold_bytes: 20000
  # ---- 以下三项是 M7 新增的关键参数 ----
  # 送进模型的历史 token 预算。**这是最关键的一个数**：
  # 默认值刻意保守（成本可预期），大上下文模型应该调高。
  max_input_tokens: 80000
  # 用量超过预算的这个比例时触发压缩（0–1）
  summarize_threshold_ratio: 0.7
  # 卸载目录。默认 <filesystem.root_dir>/.offload
  # 必须落在工作区内，否则模型拿不到路径也读不回来。
  offload_dir: null
  # 注入系统提示词的记忆上限（记忆每轮都带，必须精简）
  max_memory_chars: 8000

# ---------------------------------------------------------------- 存储
storage:
  database_url: sqlite+aiosqlite:///./data/doudou.db
  history: database
  # 单个会话在库里保留的消息条数（**保留**，不是送进模型的窗口）。
  # 保留得多一些是有意的：压缩是有损的，原始历史要能回溯。
  max_messages_per_thread: 500
  checkpointer: sqlite
  store: sqlite
  echo_sql: false

# ---------------------------------------------------------------- MCP（M5 落地）
mcp:
  enabled: true
  config_file: mcp.servers.yaml
  fail_fast: false
  tool_name_prefix: true
  call_timeout: 60

# ---------------------------------------------------------------- 通道
channels:
  cli:
    enabled: true

  feishu:                      # M4 已落地（websocket 长连接）
    enabled: false
    mode: websocket            # websocket（推荐，无需公网）| callback（未实现）
    base_url: https://open.feishu.cn
    bot_name: Doudou           # 群聊 @ 判定用，需与飞书里的显示名一致
    # bot_open_id: ou_xxx      # 更可靠的 @ 判定；留空时启动会自动获取
    # app_id / app_secret 从 .env 的 FEISHU_APP_ID / FEISHU_APP_SECRET 注入
    reply_mode: card           # card（流式卡片）| text
    stream_reply: true
    card_update_interval_ms: 800
    allowed_chats: []          # 非空即启用白名单
    allowed_users: []
    group_require_at: true     # 群里必须 @ 机器人才响应
    isolate_by_thread: false   # false = 同一个群共享一个上下文
    max_reply_chars: 4000
    dedup_ttl_seconds: 600

  webhook:
    enabled: false
    token_header: X-Doudou-Token

# ---------------------------------------------------------------- 可观测性
observability:
  langsmith:
    enabled: false
    project: doudou
  otel:
    enabled: false
    endpoint: null
  metrics:
    enabled: true
