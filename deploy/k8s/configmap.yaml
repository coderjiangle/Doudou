# 仅存放非敏感配置；密钥请使用 Secret（参考同目录说明）。
# 生成方式：
#   kubectl create configmap doudou-config --from-literal=DOUDOU_RUNTIME_LOG_LEVEL=INFO ...
apiVersion: v1
kind: ConfigMap
metadata:
  name: doudou-config
data:
  DOUDOU_RUNTIME_DEBUG: "false"
  DOUDOU_SERVER_WORKERS: "1"
  DOUDOU_RUNTIME_LOG_LEVEL: "INFO"
  DOUDOU_MCP_ENABLED: "true"
  DOUDOU_CHANNELS_FEISHU_ENABLED: "true"
  DOUDOU_CHANNELS_FEISHU_BASE_URL: "https://open.feishu.cn"
  DOUDOU_CHANNELS_FEISHU_BOT_NAME: "Doudou"
  DOUDOU_CHANNELS_FEISHU_STREAM_REPLY: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: doudou-secrets
type: Opaque
stringData:
  # 用真实值替换，或改用 sealed-secrets / 外部 KMS 注入
  DOUDOU_API_TOKEN: "REPLACE_ME"
  DOUDOU_MODEL_API_KEY: "REPLACE_ME"
  DOUDOU_CHANNELS_FEISHU_APP_ID: "REPLACE_ME"
  DOUDOU_CHANNELS_FEISHU_APP_SECRET: "REPLACE_ME"
  DOUDOU_CHANNELS_FEISHU_VERIFICATION_TOKEN: "REPLACE_ME"
  DOUDOU_CHANNELS_FEISHU_ENCRYPT_KEY: "REPLACE_ME"
