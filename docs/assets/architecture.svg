<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="960" viewBox="0 0 1360 960" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif">
  <defs>
    <marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#22c55e"/>
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b5cf6"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1360" height="960" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="680" y="58" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a">Doudou 架构总览</text>
  <text x="680" y="86" text-anchor="middle" font-size="14" fill="#64748b">通道 / gateway / 自研 ReAct / 工具与支撑 —— 同一套 Agent 服务多渠道</text>

  <!-- ==================== 入口层 ==================== -->
  <rect x="40" y="110" width="1280" height="140" rx="16" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="60" y="142" font-size="13" font-weight="600" fill="#0369a1">入口层 · channels / api / cli</text>

  <g>
    <rect x="60" y="158" width="290" height="72" rx="10" fill="#ffffff" stroke="#7dd3fc" stroke-width="1.5"/>
    <text x="76" y="190" font-size="16" font-weight="600" fill="#0f172a">飞书通道</text>
    <text x="76" y="214" font-size="12.5" fill="#475569">channels.feishu · 长连接 + 流式卡片</text>

    <rect x="370" y="158" width="290" height="72" rx="10" fill="#ffffff" stroke="#7dd3fc" stroke-width="1.5"/>
    <text x="386" y="190" font-size="16" font-weight="600" fill="#0f172a">Webhook</text>
    <text x="386" y="214" font-size="12.5" fill="#475569">channels.webhook · X-Doudou-Token</text>

    <rect x="680" y="158" width="290" height="72" rx="10" fill="#ffffff" stroke="#7dd3fc" stroke-width="1.5"/>
    <text x="696" y="190" font-size="16" font-weight="600" fill="#0f172a">CLI</text>
    <text x="696" y="214" font-size="12.5" fill="#475569">channels.cli · chat / ask / tools</text>

    <rect x="990" y="158" width="290" height="72" rx="10" fill="#ffffff" stroke="#7dd3fc" stroke-width="1.5"/>
    <text x="1006" y="190" font-size="16" font-weight="600" fill="#0f172a">HTTP API</text>
    <text x="1006" y="214" font-size="12.5" fill="#475569">api.routes · REST / SSE / Bearer</text>
  </g>

  <!-- 入口 → gateway：汇流 -->
  <path d="M205,230 L205,270 M515,230 L515,270 M825,230 L825,270 M1135,230 L1135,270"
        stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M205,270 L1135,270" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round"/>
  <line x1="680" y1="270" x2="680" y2="296" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-sky)"/>
  <text x="694" y="260" font-size="11.5" fill="#0369a1">InboundMessage / RunRequest</text>

  <!-- ==================== gateway ==================== -->
  <rect x="40" y="300" width="1280" height="140" rx="16" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="60" y="332" font-size="13" font-weight="600" fill="#15803d">gateway · 会话 / 路由 / 执行</text>

  <g>
    <rect x="60" y="348" width="280" height="72" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
    <text x="76" y="380" font-size="16" font-weight="600" fill="#0f172a">session</text>
    <text x="76" y="404" font-size="12.5" fill="#475569">会话 ↔ thread 映射 · 进程内锁</text>

    <rect x="360" y="348" width="280" height="72" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
    <text x="376" y="380" font-size="16" font-weight="600" fill="#0f172a">bus</text>
    <text x="376" y="404" font-size="12.5" fill="#475569">按会话串行 · 跨会话并发</text>

    <rect x="660" y="348" width="280" height="72" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
    <text x="676" y="380" font-size="16" font-weight="600" fill="#0f172a">router</text>
    <text x="676" y="404" font-size="12.5" fill="#475569">InboundMessage → Agent 输入</text>

    <rect x="960" y="348" width="300" height="72" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
    <text x="976" y="380" font-size="16" font-weight="600" fill="#0f172a">runner</text>
    <text x="976" y="404" font-size="12.5" fill="#475569">执行 + 事件回流 + 历史落库</text>
  </g>

  <line x1="680" y1="440" x2="680" y2="466" stroke="#22c55e" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="694" y="460" font-size="11.5" fill="#15803d">agent 调用</text>

  <!-- ==================== agent core ==================== -->
  <rect x="40" y="470" width="1280" height="260" rx="16" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
  <text x="60" y="502" font-size="13" font-weight="600" fill="#b45309">agent core · 自研 ReAct 循环（doudou.agent.react）</text>

  <g font-size="14" fill="#1e293b">
    <rect x="60" y="520" width="700" height="44" rx="9" fill="#ffffff" stroke="#fcd34d" stroke-width="1.2"/>
    <text x="78" y="548">系统提示词：长期记忆（AGENTS.md） + Skill 索引</text>

    <rect x="60" y="574" width="700" height="44" rx="9" fill="#ffffff" stroke="#fcd34d" stroke-width="1.2"/>
    <text x="78" y="602">上下文工程：token 预算裁剪 / 摘要压缩 / 大结果卸载</text>

    <rect x="60" y="628" width="700" height="44" rx="9" fill="#ffffff" stroke="#fcd34d" stroke-width="1.2"/>
    <text x="78" y="656">权限规则 + 人工确认：ApprovalBroker（超时按拒绝）</text>

    <rect x="60" y="682" width="700" height="44" rx="9" fill="#ffffff" stroke="#fcd34d" stroke-width="1.2"/>
    <text x="78" y="710">事件流 RunEvent → CLI / SSE / 飞书卡片各自渲染</text>
  </g>

  <!-- Tool Registry -->
  <rect x="800" y="516" width="500" height="196" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="820" y="544" font-size="15" font-weight="700" fill="#6d28d9">Tool Registry</text>
  <text x="820" y="565" font-size="11.5" fill="#7c3aed">工具清单 = 现在真的能用（依赖不满足就不注册）</text>

  <g>
    <rect x="820" y="578" width="460" height="34" rx="8" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.2"/>
    <text x="834" y="600" font-size="12.5" fill="#312e81">builtin：workspace_* / now / shell_exec / web_search</text>

    <rect x="820" y="620" width="460" height="34" rx="8" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.2"/>
    <text x="834" y="642" font-size="12.5" fill="#312e81">MCP：server__tool（逐个 server 拉取，失败降级）</text>

    <rect x="820" y="662" width="460" height="34" rx="8" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.2"/>
    <text x="834" y="684" font-size="12.5" fill="#312e81">task → 子 Agent（独立提示词 / 工具白名单）</text>
  </g>

  <line x1="800" y1="600" x2="764" y2="600" stroke="#8b5cf6" stroke-width="2" marker-start="url(#arrow-violet)"/>

  <!-- agent → 支撑 -->
  <line x1="680" y1="730" x2="680" y2="776" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow-slate)"/>
  <text x="694" y="758" font-size="11.5" fill="#64748b">依赖注入（旁路失败不影响运行）</text>

  <!-- ==================== 支撑层 ==================== -->
  <rect x="40" y="780" width="1280" height="120" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="60" y="812" font-size="13" font-weight="600" fill="#475569">支撑层 · 依赖注入</text>

  <g>
    <rect x="60" y="826" width="290" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="76" y="853" font-size="15" font-weight="600" fill="#0f172a">config</text>
    <text x="76" y="875" font-size="11.5" fill="#475569">yaml + .env · 唯一配置入口</text>

    <rect x="370" y="826" width="290" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="386" y="853" font-size="15" font-weight="600" fill="#0f172a">storage</text>
    <text x="386" y="875" font-size="11.5" fill="#475569">SQLite / Postgres · 重启可续</text>

    <rect x="680" y="826" width="290" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="696" y="853" font-size="15" font-weight="600" fill="#0f172a">observability</text>
    <text x="696" y="875" font-size="11.5" fill="#475569">日志 · 审计 · 成本 · 追踪</text>

    <rect x="990" y="826" width="290" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="1006" y="853" font-size="15" font-weight="600" fill="#0f172a">security / utils</text>
    <text x="1006" y="875" font-size="11.5" fill="#475569">脱敏 · 鉴权 · 重试 · 文本</text>
  </g>

  <text x="680" y="936" text-anchor="middle" font-size="12" fill="#94a3b8">实线 = 一次运行的主链路 · 虚线 = 依赖 / 旁路</text>
</svg>
