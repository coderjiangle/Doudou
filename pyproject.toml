[tool.uv]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doudou"
version = "0.1.0"
description = "Doudou - 自研 ReAct 内核的个人助手 Agent，支持 Tool / MCP / Skill 与飞书通道"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Jiang Le" }]
keywords = ["agent", "llm", "langchain", "mcp", "agent-skills", "feishu", "react"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

dependencies = [
    # ---- Agent 核心 ----
    # 编排是自研的（src/doudou/agent/react.py）。这里只借 LangChain 的**基础件**：
    # ``langchain-core``（BaseTool / BaseMessage）与 ``langchain`` 的 ``init_chat_model``
    # （唯一的 provider 适配入口）。**不要**引入 deepagents / langgraph ——
    # 评估过，收益抵不上多一个必须跟随的框架。
    "langchain>=1.4,<2",
    "langchain-openai>=1.7,<2",

    # ---- MCP ----
    "langchain-mcp-adapters>=0.3,<1",

    # ---- Web 服务 ----
    "fastapi>=0.159,<1",
    "uvicorn[standard]>=0.54,<1",
    "sse-starlette>=3.5,<4",
    "python-multipart>=0.0.32",

    # ---- 飞书通道 ----
    "lark-oapi>=1.7.5,<2",

    # ---- 配置 ----
    "pydantic>=2.12",
    "pydantic-settings>=2.16,<3",
    "pyyaml>=6.0.3,<7",
    "python-dotenv>=1.1",

    # ---- 存储 ----
    # [asyncio] 会带上 greenlet；AsyncSession 缺它会在 import 阶段就失败。
    "sqlalchemy[asyncio]>=2.1,<3",
    "aiosqlite>=0.22,<1",
    "alembic>=1.20,<2",

    # ---- 通用 ----
    "httpx>=0.28,<1",
    "tenacity>=8.2.3",
    "structlog>=26.1,<27",
    "typer>=0.27,<1",
    "rich>=13.9",
    "apscheduler>=3.11,<4",
    # Windows 上没有系统 tzdata，zoneinfo 依赖该包解析 IANA 时区名
    "tzdata>=2025.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=1.7,<2"]
deepseek = ["langchain-deepseek>=1.1,<2"]
postgres = ["asyncpg>=0.30", "psycopg[binary]>=3.2"]
otel = ["opentelemetry-sdk>=1.30", "opentelemetry-exporter-otlp>=1.30"]
# LLM 级追踪。装不上或不配 key 时追踪整体降级为 no-op，
# 因此它是可选依赖而不是核心依赖。
tracing = ["langfuse>=3,<4"]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-cov>=6",
    "ruff>=0.17,<1",
    "mypy>=2.4,<3",
    "types-pyyaml>=6.0.12",
    "pre-commit>=4.7,<5",
    # 依赖漏洞扫描（`make audit` 用的就是它）：只审运行时依赖，dev 工具的告警没有处置路径。
    "pip-audit>=2.9,<3",
]

[project.scripts]
doudou = "doudou.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/doudou"]

[tool.hatch.build.targets.sdist]
include = ["src", "config", "skills", "docs", "README.md"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["src/doudou/storage/migrations/versions"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "B",         # flake8-bugbear
    "C4",        # flake8-comprehensions
    "UP",        # pyupgrade
    "ASYNC",     # flake8-async
    "S",         # flake8-bandit
    "RUF",       # ruff-specific
]
ignore = [
    "S101",  # assert：测试与类型收窄都要用
    # 项目注释与 docstring 用中文书写，全角标点是有意为之，不属于「易混淆字符」
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "E501"]
"scripts/**" = ["S", "T201"]

[tool.ruff.lint.isort]
known-first-party = ["doudou"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
files = ["src/doudou"]
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["lark_oapi.*", "langchain_mcp_adapters.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers --strict-config -m 'not integration'"
markers = [
    "integration: 需要真实外部依赖（模型 / 网络 / 数据库）的测试；默认被 addopts 排除，用 make test-all 运行",
    "slow: 耗时较长的测试",
]
filterwarnings = ["error::DeprecationWarning:doudou.*"]

[tool.coverage.run]
source = ["src/doudou"]
branch = true

[tool.coverage.report]
exclude_lines = ["if TYPE_CHECKING:", "if __name__ == .__main__.:", "raise NotImplementedError"]
