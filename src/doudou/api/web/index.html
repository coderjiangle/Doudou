<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doudou</title>
<link rel="icon" type="image/png" href="avatar.png">
<style>
  :root {
    --ink: #0f172a;
    --muted: #64748b;
    --line: rgba(15, 23, 42, 0.08);
    --brand: #0f766e;
    --brand-2: #14b8a6;
    --danger: #b91c1c;
    --card: #ffffff;
    --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
    --shadow-md: 0 14px 34px -18px rgba(15, 23, 42, 0.3);
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    color: var(--ink);
    font: 14px/1.55 -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    background:
      radial-gradient(1100px 520px at -5% -10%, #d7f2ec 0%, rgba(215, 242, 236, 0) 60%),
      radial-gradient(900px 480px at 105% -5%, #ffe9d2 0%, rgba(255, 233, 210, 0) 55%),
      linear-gradient(180deg, #f8fafb 0%, #f2f4f7 100%);
    display: flex;
    flex-direction: column;
  }
  button { font: inherit; cursor: pointer; }
  code { background: rgba(15, 23, 42, 0.06); padding: 1px 5px; border-radius: 5px; }

  /* ---------------------------------------------------------------- 顶栏 */
  header {
    position: relative;
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 22px;
    background: rgba(255, 255, 255, 0.72);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand img {
    width: 36px; height: 36px;
    border-radius: 12px;
    object-fit: cover;
    border: 1px solid rgba(255, 255, 255, 0.9);
    box-shadow: 0 6px 16px -6px rgba(15, 118, 110, 0.5);
  }
  .brand .name { font-size: 17px; font-weight: 750; letter-spacing: 0.2px; }
  .brand .tag { font-size: 12px; color: var(--muted); }
  .status {
    margin-left: auto;
    display: flex; align-items: center; gap: 8px;
    padding: 6px 12px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.78);
    border: 1px solid var(--line);
    box-shadow: var(--shadow-sm);
    color: var(--muted);
    font-size: 12.5px;
    max-width: 52vw;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #9ca3af; flex: none; }
  .dot.ok { background: #16a34a; box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.14); }
  .dot.bad { background: var(--danger); box-shadow: 0 0 0 3px rgba(185, 28, 28, 0.12); }
  .ghost {
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.78);
    border-radius: 10px;
    padding: 7px 12px;
    color: var(--ink);
    font-size: 13px;
    box-shadow: var(--shadow-sm);
    transition: background 0.15s, border-color 0.15s;
  }
  .ghost:hover { background: #fff; border-color: rgba(15, 118, 110, 0.28); }

  /* ---------------------------------------------------------------- 设置 */
  .settings {
    display: grid;
    grid-template-columns: 1fr 1fr auto;
    gap: 12px;
    align-items: end;
    margin: 14px 22px 0;
    padding: 14px 16px;
    background: rgba(255, 255, 255, 0.92);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow-md);
  }
  .settings.hidden { display: none; }
  .settings label { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--muted); }
  .settings input {
    font: inherit;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: #fff;
    color: var(--ink);
  }
  .settings input:focus { outline: 2px solid rgba(20, 184, 166, 0.25); border-color: var(--brand); }
  .settings button {
    border: 0;
    border-radius: 9px;
    padding: 9px 16px;
    background: linear-gradient(135deg, var(--brand), #0d9488);
    color: #fff;
    font-weight: 600;
    box-shadow: 0 8px 18px -10px rgba(13, 148, 136, 0.8);
  }
  .settings .hint { grid-column: 1 / -1; margin: 0; color: var(--muted); font-size: 12px; }

  /* ---------------------------------------------------------------- 主体 */
  main { flex: 1; display: flex; min-height: 0; }
  aside {
    width: 282px;
    flex: none;
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: rgba(255, 255, 255, 0.55);
    backdrop-filter: blur(12px);
    border-right: 1px solid var(--line);
  }
  .side-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px 10px;
    font-size: 12px; font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--muted);
    text-transform: uppercase;
  }
  .side-head button {
    border: 1px solid var(--line);
    background: #fff;
    border-radius: 999px;
    padding: 5px 11px;
    font-size: 12px;
    color: var(--brand);
    box-shadow: var(--shadow-sm);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .side-head button:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
  #threads {
    list-style: none;
    margin: 0;
    padding: 4px 8px 12px;
    overflow-y: auto;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .thread {
    position: relative;
    padding: 10px 34px 10px 12px;
    border-radius: 12px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, box-shadow 0.15s;
  }
  .thread:hover { background: rgba(255, 255, 255, 0.85); border-color: var(--line); }
  .thread.active {
    background: #fff;
    border-color: rgba(15, 118, 110, 0.18);
    box-shadow: var(--shadow-sm);
  }
  .thread.active::before {
    content: "";
    position: absolute;
    left: 0; top: 12px; bottom: 12px;
    width: 3px;
    border-radius: 3px;
    background: linear-gradient(var(--brand), var(--brand-2));
  }
  .thread .t-title {
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .thread .t-meta { color: var(--muted); font-size: 11.5px; margin-top: 2px; }
  .thread .t-del {
    position: absolute;
    right: 7px; top: 9px;
    border: 0;
    background: transparent;
    color: var(--muted);
    font-size: 15px;
    line-height: 1;
    padding: 3px 6px;
    border-radius: 7px;
    display: none;
  }
  .thread:hover .t-del { display: block; }
  .thread .t-del:hover { background: #fee2e2; color: var(--danger); }
  .empty { color: var(--muted); font-size: 12.5px; padding: 10px 18px; }

  .chat { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 28px 24px 14px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    scrollbar-width: thin;
    scrollbar-color: rgba(100, 116, 139, 0.35) transparent;
  }
  .messages::-webkit-scrollbar { width: 8px; }
  .messages::-webkit-scrollbar-thumb { background: rgba(100, 116, 139, 0.3); border-radius: 8px; }

  /* ---------------------------------------------------------------- 欢迎页 */
  .welcome { margin: auto; text-align: center; max-width: 560px; padding: 12px 20px 40px; }
  .welcome-avatar {
    width: 88px; height: 88px;
    border-radius: 28px;
    object-fit: cover;
    border: 3px solid rgba(255, 255, 255, 0.95);
    box-shadow: 0 20px 44px -20px rgba(15, 118, 110, 0.55);
    margin-bottom: 18px;
  }
  .welcome h2 {
    margin: 0 0 6px;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.02em;
    background: linear-gradient(120deg, #0f766e, #0f172a);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .welcome p { margin: 0; color: var(--muted); }
  .suggestions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 20px; }
  .suggestion {
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.85);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 13px;
    color: #334155;
    box-shadow: var(--shadow-sm);
    transition: transform 0.15s, border-color 0.15s, color 0.15s;
  }
  .suggestion:hover {
    transform: translateY(-1px);
    border-color: rgba(15, 118, 110, 0.35);
    color: var(--brand);
  }

  /* ---------------------------------------------------------------- 消息 */
  .msg {
    display: flex;
    gap: 11px;
    max-width: 900px;
    width: 100%;
    animation: rise 0.18s ease-out;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .msg .avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    flex: none;
    overflow: hidden;
    border: 2px solid #fff;
    box-shadow: var(--shadow-sm);
    display: grid;
    place-items: center;
    background: #e2e8f0;
    font-size: 13px;
    font-weight: 700;
  }
  .msg .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.user .avatar { background: linear-gradient(135deg, var(--brand), var(--brand-2)); color: #fff; }
  .msg-body {
    min-width: 0;
    max-width: min(760px, 82vw);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .msg.user .msg-body { align-items: flex-end; }
  .bubble {
    min-width: 0;
    max-width: 100%;
    padding: 11px 15px;
    border-radius: 16px;
    background: var(--card);
    border: 1px solid #eef0f3;
    box-shadow: var(--shadow-sm);
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 14.5px;
    line-height: 1.65;
  }
  .msg.assistant .bubble { border-bottom-left-radius: 6px; }
  .msg.user .bubble {
    background: linear-gradient(135deg, #0f766e, #0d9488);
    border: 0;
    color: #fff;
    border-bottom-right-radius: 6px;
    box-shadow: 0 12px 26px -16px rgba(13, 148, 136, 0.75);
  }
  .msg.error .bubble { border-color: #fecaca; background: #fef2f2; color: var(--danger); }

  /* 工具调用：折叠成一行放在助手回复上方；展开才看 chips 与各工具结果 */
  .tool-fold {
    border: 1px dashed #dbe3ea;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.72);
    font-size: 12.5px;
    color: var(--muted);
    overflow: hidden;
  }
  .tool-fold > summary {
    cursor: pointer;
    padding: 5px 11px;
    color: var(--brand);
    user-select: none;
    list-style: none;
    /* 收起时**必须只有一行**：工具再多也不该把回复顶下去 */
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tool-fold > summary::-webkit-details-marker { display: none; }
  .tool-fold > summary::before { content: "▸ "; }
  .tool-fold[open] > summary::before { content: "▾ "; }
  .tool-fold[open] > summary { border-bottom: 1px dashed #e6ecf2; }
  .tool-fold > summary:hover { text-decoration: underline; }
  .tool-list { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 11px; }
  .tool-results { padding: 0 11px 9px; }
  .tool-results > details + details { margin-top: 6px; }
  .tool-result { font-size: 12px; color: var(--muted); }
  .tool-result > summary { cursor: pointer; color: var(--brand); user-select: none; }
  .tool-result pre {
    margin: 6px 0 0;
    padding: 8px 10px;
    max-height: 240px;
    overflow: auto;
    white-space: pre-wrap;
    word-break: break-word;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    font-size: 12px;
    color: #475569;
  }

  .chip {
    font-size: 12px;
    color: #374151;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 999px;
    padding: 2px 9px;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .chip.ok { background: #ecfdf5; border-color: #a7f3d0; color: #047857; }
  .chip.bad { background: #fef2f2; border-color: #fecaca; color: var(--danger); }

  /* ---------------------------------------------------------------- Markdown */
  .bubble.md { white-space: normal; }
  .bubble.md > :first-child { margin-top: 0; }
  .bubble.md > :last-child { margin-bottom: 0; }
  .bubble.md h1, .bubble.md h2, .bubble.md h3, .bubble.md h4 {
    margin: 16px 0 8px;
    line-height: 1.35;
    font-weight: 700;
  }
  .bubble.md h1 { font-size: 21px; }
  .bubble.md h2 { font-size: 18px; }
  .bubble.md h3 { font-size: 16px; }
  .bubble.md h4 { font-size: 15px; }
  .bubble.md p { margin: 8px 0; }
  .bubble.md ul, .bubble.md ol { margin: 8px 0; padding-left: 22px; }
  .bubble.md li { margin: 3px 0; }
  .bubble.md li::marker { color: #94a3b8; }
  .bubble.md code {
    font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
    font-size: 12.5px;
    background: #f1f5f9;
    border: 1px solid #e2e8f0;
    padding: 1px 5px;
    border-radius: 5px;
  }
  .bubble.md pre {
    position: relative;
    margin: 10px 0;
    padding: 13px 14px;
    border-radius: 10px;
    background: #0f172a;
    color: #e2e8f0;
    overflow: auto;
    max-height: 420px;
  }
  .bubble.md pre code {
    background: transparent;
    border: 0;
    padding: 0;
    color: inherit;
    font-size: 12.5px;
    line-height: 1.6;
  }
  .bubble.md pre[data-lang]::before {
    content: attr(data-lang);
    position: absolute;
    top: 6px; right: 10px;
    font-size: 10.5px;
    color: #94a3b8;
  }
  .bubble.md blockquote {
    margin: 10px 0;
    padding: 6px 12px;
    border-left: 3px solid #5eead4;
    background: #f8fafc;
    color: #475569;
    border-radius: 0 8px 8px 0;
  }
  .bubble.md blockquote p { margin: 4px 0; }
  .bubble.md a { color: var(--brand); text-decoration: underline; text-underline-offset: 2px; }
  .bubble.md hr { border: 0; border-top: 1px solid #e2e8f0; margin: 14px 0; }
  .bubble.md .table-wrap { margin: 10px 0; overflow-x: auto; border-radius: 8px; }
  .bubble.md table { border-collapse: collapse; width: 100%; font-size: 13px; }
  .bubble.md th, .bubble.md td {
    border: 1px solid #e2e8f0;
    padding: 6px 9px;
    text-align: left;
    vertical-align: top;
  }
  .bubble.md th { background: #f8fafc; font-weight: 600; white-space: nowrap; }
  .bubble.md tbody tr:nth-child(even) { background: #fcfdff; }
  .bubble.md .stopped { color: var(--muted); font-size: 12.5px; margin-top: 8px; }

  .typing { display: inline-flex; align-items: center; gap: 4px; padding: 4px 0; }
  .typing i {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #94a3b8;
    animation: blink 1.2s infinite;
  }
  .typing i:nth-child(2) { animation-delay: 0.18s; }
  .typing i:nth-child(3) { animation-delay: 0.36s; }
  @keyframes blink {
    0%, 80%, 100% { opacity: 0.25; transform: translateY(0); }
    40% { opacity: 1; transform: translateY(-2px); }
  }

  /* ---------------------------------------------------------------- 确认与错误 */
  .approvals { display: grid; gap: 8px; padding: 0 24px 10px; }
  .approvals[hidden] { display: none; }
  .approval {
    display: grid;
    gap: 6px;
    padding: 12px 14px;
    border-radius: 14px;
    border: 1px solid #fcd34d;
    background: linear-gradient(180deg, #fffdf5, #fffbeb);
    box-shadow: var(--shadow-sm);
  }
  .approval .a-title { font-size: 13px; font-weight: 700; color: #92400e; }
  .approval pre {
    margin: 0;
    font-size: 12px;
    color: #57534e;
    max-height: 90px;
    overflow: auto;
    white-space: pre-wrap;
    word-break: break-all;
    background: rgba(255, 255, 255, 0.6);
    border-radius: 8px;
    padding: 7px 9px;
  }
  .approval .a-actions { display: flex; gap: 8px; }
  .approval button {
    border: 1px solid #d6d3d1;
    background: #fff;
    border-radius: 8px;
    padding: 5px 14px;
    font-size: 12.5px;
  }
  .approval button.primary {
    background: linear-gradient(135deg, var(--brand), #0d9488);
    border: 0;
    color: #fff;
    box-shadow: 0 6px 14px -8px rgba(13, 148, 136, 0.8);
  }
  .approval button.danger { color: var(--danger); border-color: #fecaca; }

  .error-bar {
    margin: 0 24px 10px;
    padding: 9px 13px;
    border-radius: 10px;
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: var(--danger);
    font-size: 13px;
  }
  .error-bar.hidden { display: none; }

  /* ---------------------------------------------------------------- 输入区 */
  .composer-wrap {
    padding: 10px 22px 16px;
    background: linear-gradient(180deg, rgba(242, 244, 247, 0), rgba(255, 255, 255, 0.88) 45%);
  }
  .composer {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    /* 宽度跟随聊天区：占一半，避免宽屏上被固定 960px 卡得太短。 */
    width: 50%;
    min-width: 280px;
    margin: 0 auto;
    padding: 8px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: var(--shadow-md);
    transition: box-shadow 0.15s, border-color 0.15s;
  }
  .composer:focus-within {
    border-color: rgba(15, 118, 110, 0.35);
    box-shadow: 0 0 0 4px rgba(20, 184, 166, 0.12), var(--shadow-md);
  }
  .composer textarea {
    flex: 1;
    resize: none;
    border: 0;
    background: transparent;
    font: inherit;
    line-height: 1.5;
    padding: 8px 10px;
    max-height: 180px;
    min-height: 38px;
    color: var(--ink);
  }
  .composer textarea:focus { outline: none; }
  .composer textarea::placeholder { color: #9aa4b2; }
  .composer button[type="submit"] {
    border: 0;
    border-radius: 12px;
    height: 38px;
    padding: 0 20px;
    background: linear-gradient(135deg, var(--brand), #0d9488);
    color: #fff;
    font-weight: 650;
    box-shadow: 0 10px 22px -12px rgba(13, 148, 136, 0.85);
    transition: transform 0.12s, filter 0.12s;
  }
  .composer button[type="submit"]:hover { filter: brightness(1.05); transform: translateY(-1px); }
  .composer button[type="submit"].stop {
    background: linear-gradient(135deg, #dc2626, #ef4444);
    box-shadow: 0 10px 22px -12px rgba(220, 38, 38, 0.8);
  }
  .composer-hint {
    max-width: 960px;
    margin: 7px auto 0;
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 0 6px;
    color: #94a3b8;
    font-size: 11.5px;
  }

  @media (max-width: 820px) {
    aside { display: none; }
    .settings { grid-template-columns: 1fr; }
    .settings button { width: 100%; }
    .messages { padding: 20px 14px 10px; }
    .composer-wrap { padding: 8px 12px 12px; }
    .composer-hint { display: none; }
    .status { max-width: 44vw; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <img src="avatar.png" alt="豆豆">
    <div>
      <div class="name">Doudou</div>
      <div class="tag">你的个人助手</div>
    </div>
  </div>
  <div class="status"><span id="dot" class="dot"></span><span id="model">连接中…</span></div>
  <a id="statsLink" class="ghost" href="./stats" style="text-decoration:none;display:inline-flex;align-items:center">统计</a>
  <button id="settingsBtn" class="ghost" type="button">设置</button>
</header>

<div id="settings" class="settings hidden">
  <label>服务地址
    <input id="baseUrl" placeholder="留空 = 与页面同源，例如 http://127.0.0.1:8000">
  </label>
  <label>访问令牌
    <input id="token" type="password" placeholder="DOUDOU_API_TOKEN，未开启鉴权可留空">
  </label>
  <button id="saveSettings" type="button">保存并重连</button>
  <p class="hint">跨域访问时，需要在服务端 <code>server.cors_origins</code> 里放行本页面的来源。</p>
</div>

<main>
  <aside>
    <div class="side-head">
      <span>会话</span>
      <button id="newChat" type="button">＋ 新会话</button>
    </div>
    <ul id="threads"></ul>
    <div id="threadsEmpty" class="empty">还没有会话</div>
  </aside>

  <section class="chat">
    <div id="messages" class="messages"></div>
    <div id="approvals" class="approvals" hidden></div>
    <div id="errorBar" class="error-bar hidden"></div>
    <form id="composer" class="composer">
      <textarea id="input" rows="1" placeholder="说点什么…"></textarea>
      <button id="send" type="submit">发送</button>
    </form>
    <div class="composer-hint">
      <span>Enter 发送 · Shift+Enter 换行</span>
      <span id="modelHint"></span>
    </div>
  </section>
</main>

<script>
(() => {
  "use strict";

  const LS_BASE = "doudou.baseUrl";
  const LS_TOKEN = "doudou.token";
  // 服务端渲染时替换成实际的 server.base_path。
  const BASE_PATH = "__DOUDOU_BASE_PATH__";
  const SUGGESTIONS = ["现在几点了？", "帮我把今天的待办整理一下", "列一下工作区里的文件"];

  const el = (id) => document.getElementById(id);
  const state = { threadId: null, busy: false, controller: null };

  // ------------------------------------------------------------------ 基础请求

  function apiRoot() {
    const raw = el("baseUrl").value.trim().replace(/\/+$/, "");
    const root = raw || location.origin;
    return /\/api\/v\d+$/i.test(root) ? root : `${root}${BASE_PATH}`;
  }

  function authHeaders(json) {
    const headers = {};
    const token = el("token").value.trim();
    if (token) headers.Authorization = `Bearer ${token}`;
    if (json) headers["Content-Type"] = "application/json";
    return headers;
  }

  async function request(path, options = {}) {
    const response = await fetch(`${apiRoot()}${path}`, {
      ...options,
      headers: { ...authHeaders(Boolean(options.body)), ...(options.headers || {}) },
    });
    if (!response.ok) {
      let message = `HTTP ${response.status}`;
      try {
        const body = await response.json();
        if (body && body.error && body.error.message) message = body.error.message;
      } catch (_) { /* 非 JSON 错误体，保留状态码 */ }
      if (response.status === 401) message = "访问令牌无效或未填写（点右上角「设置」）";
      throw new Error(message);
    }
    return response;
  }

  function showError(message) {
    const bar = el("errorBar");
    if (!message) { bar.classList.add("hidden"); bar.textContent = ""; return; }
    bar.textContent = message;
    bar.classList.remove("hidden");
  }

  // ------------------------------------------------------------------ 健康状态

  async function refreshHealth() {
    const dot = el("dot");
    try {
      // /health 不需要鉴权。
      const response = await fetch(`${apiRoot()}/health`);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const health = await response.json();
      const tools = Array.isArray(health.tools) ? health.tools.length : 0;
      el("model").textContent = health.model;
      el("model").title = `${health.model} · ${tools} 个工具 · ${health.env}`;
      el("modelHint").textContent = `${tools} 个工具 · ${health.env}`;
      dot.className = "dot ok";
      showError("");
    } catch (err) {
      el("model").textContent = "未连接";
      el("modelHint").textContent = "";
      dot.className = "dot bad";
      showError(`连接服务失败：${err.message}`);
    }
  }

  // ------------------------------------------------------------------ 会话列表

  function formatTime(value) {
    if (!value) return "";
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return "";
    const pad = (n) => String(n).padStart(2, "0");
    return `${pad(date.getMonth() + 1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}`;
  }

  function renderThreads(threads) {
    const list = el("threads");
    list.replaceChildren();
    el("threadsEmpty").hidden = threads.length > 0;

    for (const thread of threads) {
      const item = document.createElement("li");
      item.className = "thread" + (thread.thread_id === state.threadId ? " active" : "");
      item.dataset.id = thread.thread_id;

      const title = document.createElement("div");
      title.className = "t-title";
      title.textContent = thread.conversation_id || thread.thread_id;
      title.title = thread.thread_id;

      const meta = document.createElement("div");
      meta.className = "t-meta";
      meta.textContent = `${thread.message_count} 条 · ${formatTime(thread.updated_at)}`;

      const remove = document.createElement("button");
      remove.className = "t-del";
      remove.type = "button";
      remove.title = "删除会话";
      remove.textContent = "×";
      remove.addEventListener("click", (event) => {
        event.stopPropagation();
        deleteThread(thread.thread_id);
      });

      item.append(title, meta, remove);
      item.addEventListener("click", () => openThread(thread.thread_id));
      list.append(item);
    }
  }

  async function refreshThreads() {
    try {
      const response = await request("/threads?limit=50");
      const body = await response.json();
      renderThreads(body.threads || []);
    } catch (err) {
      showError(`读取会话失败：${err.message}`);
    }
  }

  async function deleteThread(threadId) {
    if (!confirm(`删除会话 ${threadId}？历史会一起删掉。`)) return;
    try {
      await request(`/threads/${encodeURIComponent(threadId)}`, { method: "DELETE" });
      if (state.threadId === threadId) newChat();
      await refreshThreads();
    } catch (err) {
      showError(`删除失败：${err.message}`);
    }
  }

  // ------------------------------------------------------------------ 人工确认

  async function loadApprovals() {
    let body;
    try {
      body = await (await request("/approvals")).json();
    } catch (_) {
      return; // 未开启鉴权/服务不可用时，不打扰聊天界面
    }
    const pending = Array.isArray(body.pending) ? body.pending : [];
    const box = el("approvals");
    box.replaceChildren();
    box.hidden = pending.length === 0;

    for (const item of pending) {
      const card = document.createElement("div");
      card.className = "approval";

      const title = document.createElement("div");
      title.className = "a-title";
      title.textContent = `需要确认：${item.tool_name}`;

      const args = document.createElement("pre");
      args.textContent = JSON.stringify(item.args || {}, null, 2);

      const actions = document.createElement("div");
      actions.className = "a-actions";
      for (const [label, approved, style] of [
        ["同意执行", true, "primary"],
        ["拒绝", false, "danger"],
      ]) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = label;
        button.className = style;
        button.addEventListener("click", () => decide(item.approval_id, approved));
        actions.append(button);
      }

      card.append(title, args, actions);
      box.append(card);
    }
  }

  async function decide(approvalId, approved) {
    try {
      await request(`/approvals/${encodeURIComponent(approvalId)}`, {
        method: "POST",
        body: JSON.stringify({ approved }),
      });
    } catch (err) {
      showError(`确认失败：${err.message}`);
    } finally {
      loadApprovals();
    }
  }

  // ------------------------------------------------------------------ Markdown

  function escapeHtml(text) {
    return String(text ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function renderInline(text) {
    let out = escapeHtml(text);
    const codes = [];
    out = out.replace(/`([^`\n]+)`/g, (_, code) => {
      codes.push(code);
      return `\u0000${codes.length - 1}\u0000`;
    });
    out = out.replace(
      /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
      (_, label, url) => `<a href="${url}" target="_blank" rel="noopener noreferrer">${label}</a>`,
    );
    out = out.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
    out = out.replace(/~~([^~\n]+)~~/g, "<del>$1</del>");
    out = out.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
    return out.replace(/\u0000(\d+)\u0000/g, (_, index) => `<code>${codes[Number(index)]}</code>`);
  }

  function splitTableRow(line) {
    return line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((cell) => cell.trim());
  }

  /**
   * 极简 Markdown：标题、列表、表格、代码块、引用、链接与常见行内样式。
   * 先转义再拼 HTML，链接只放行 http(s)，避免模型输出把页面注入坏掉。
   */
  function renderMarkdown(text) {
    const lines = String(text ?? "").replace(/\r\n/g, "\n").split("\n");
    const html = [];
    let i = 0;

    while (i < lines.length) {
      const line = lines[i];
      if (!line.trim()) { i += 1; continue; }

      const fence = line.match(/^```\s*([\w.+#-]*)\s*$/);
      if (fence) {
        const lang = fence[1] || "";
        const body = [];
        i += 1;
        while (i < lines.length && !/^```/.test(lines[i])) { body.push(lines[i]); i += 1; }
        i += 1;
        const langAttr = lang ? ` data-lang="${escapeHtml(lang)}"` : "";
        html.push(`<pre${langAttr}><code>${escapeHtml(body.join("\n"))}</code></pre>`);
        continue;
      }

      const heading = line.match(/^(#{1,6})\s+(.*)$/);
      if (heading) {
        const level = heading[1].length;
        html.push(`<h${level}>${renderInline(heading[2])}</h${level}>`);
        i += 1;
        continue;
      }

      if (/^\s*(---+|\*\*\*+)\s*$/.test(line)) { html.push("<hr>"); i += 1; continue; }

      if (line.includes("|") && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1])) {
        const header = splitTableRow(line);
        i += 2;
        const rows = [];
        while (i < lines.length && lines[i].includes("|") && lines[i].trim()) {
          rows.push(splitTableRow(lines[i]));
          i += 1;
        }
        const thead = header.map((cell) => `<th>${renderInline(cell)}</th>`).join("");
        const tbody = rows
          .map((row) => `<tr>${row.map((cell) => `<td>${renderInline(cell)}</td>`).join("")}</tr>`)
          .join("");
        html.push(`<div class="table-wrap"><table><thead><tr>${thead}</tr></thead><tbody>${tbody}</tbody></table></div>`);
        continue;
      }

      if (/^>\s?/.test(line)) {
        const body = [];
        while (i < lines.length && /^>\s?/.test(lines[i])) {
          body.push(lines[i].replace(/^>\s?/, ""));
          i += 1;
        }
        html.push(`<blockquote>${renderMarkdown(body.join("\n"))}</blockquote>`);
        continue;
      }

      if (/^\s*([-*+]|\d+\.)\s+/.test(line)) {
        const ordered = /^\s*\d+\./.test(line);
        const items = [];
        while (i < lines.length) {
          const item = lines[i].match(/^\s*(?:[-*+]|\d+\.)\s+(.*)$/);
          if (item) { items.push(item[1]); i += 1; continue; }
          if (!lines[i].trim()) break;
          if (/^\s*(```|>|#{1,6}\s|([-*+]|\d+\.)\s)/.test(lines[i])) break;
          if (items.length) items[items.length - 1] += ` ${lines[i].trim()}`;
          i += 1;
        }
        const tag = ordered ? "ol" : "ul";
        html.push(`<${tag}>${items.map((item) => `<li>${renderInline(item)}</li>`).join("")}</${tag}>`);
        continue;
      }

      const paragraph = [];
      while (i < lines.length && lines[i].trim()) {
        if (/^\s*(```|>|#{1,6}\s|([-*+]|\d+\.)\s|---+|\*\*\*+)/.test(lines[i])) break;
        if (lines[i].includes("|") && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1])) break;
        paragraph.push(lines[i]);
        i += 1;
      }
      if (paragraph.length) {
        html.push(`<p>${paragraph.map(renderInline).join("<br>")}</p>`);
      } else {
        i += 1;
      }
    }
    return html.join("\n");
  }

  function truncateText(text, max) {
    const value = String(text ?? "").replace(/\s+/g, " ").trim();
    return value.length > max ? `${value.slice(0, max)}…` : value;
  }

  function toolArgSummary(args) {
    if (!args || typeof args !== "object") return "";
    const key = ["query", "command", "path", "url", "name", "title"].find(
      (name) => typeof args[name] === "string" && args[name].trim(),
    );
    return key ? truncateText(args[key], 42) : "";
  }

  // ------------------------------------------------------------------ 消息渲染

  function avatarNode(role) {
    const avatar = document.createElement("div");
    avatar.className = "avatar";
    if (role === "user") {
      avatar.textContent = "你";
    } else if (role === "tool") {
      avatar.textContent = "🛠";
    } else {
      const img = document.createElement("img");
      img.src = "avatar.png";
      img.alt = "豆豆";
      avatar.append(img);
    }
    return avatar;
  }

  function typingNode() {
    const span = document.createElement("span");
    span.className = "typing";
    for (let i = 0; i < 3; i += 1) span.append(document.createElement("i"));
    return span;
  }

  function clearMessages() {
    el("messages").replaceChildren();
  }

  function renderWelcome() {
    clearMessages();
    const box = document.createElement("div");
    box.className = "welcome";

    const avatar = document.createElement("img");
    avatar.className = "welcome-avatar";
    avatar.src = "avatar.png";
    avatar.alt = "豆豆";

    const title = document.createElement("h2");
    title.textContent = "有什么可以帮你？";

    const hint = document.createElement("p");
    hint.textContent = "左侧是历史会话；新对话会直接开一个新会话。";

    const suggestions = document.createElement("div");
    suggestions.className = "suggestions";
    for (const text of SUGGESTIONS) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "suggestion";
      button.textContent = text;
      button.addEventListener("click", () => {
        if (!state.busy) send(text);
      });
      suggestions.append(button);
    }

    box.append(avatar, title, hint, suggestions);
    el("messages").append(box);
  }

  /** 一条消息气泡，返回可继续写入的元素。 */
  function appendBubble(role, text) {
    const row = document.createElement("div");
    row.className = `msg ${role}`;
    const body = document.createElement("div");
    body.className = "msg-body";
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    body.append(bubble);
    row.append(avatarNode(role), body);
    el("messages").append(row);
    el("messages").scrollTop = el("messages").scrollHeight;
    return { row, body, bubble };
  }

  function appendMarkdown(role, text) {
    const result = appendBubble(role, "");
    result.bubble.classList.add("md");
    result.bubble.innerHTML = renderMarkdown(text);
    return result;
  }

  /** 折叠标题：「调用了 2 个工具 · web_search、now」。收起时只有这一行。 */
  function toolFoldLabel(names, failedCount = 0) {
    const unique = [...new Set(names)];
    const shown = unique.slice(0, 4).join("、") + (unique.length > 4 ? " 等" : "");
    const bad = failedCount ? `（${failedCount} 个失败）` : "";
    return `调用了 ${names.length} 个工具${bad} · ${shown}`;
  }

  /** 未完成态的工具 chip（等 tool_result 回来再 paint）。 */
  function toolChip(name, summary) {
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.textContent = `· ${name}${summary ? ` · ${summary}` : ""}`;
    return chip;
  }

  /** 把 chip 画成最终态：✓/✗ + 工具名 + 参数摘要，悬停可看结果前 300 字。 */
  function paintToolChip(chip, name, summary, ok, preview) {
    chip.className = `chip ${ok ? "ok" : "bad"}`;
    chip.textContent = `${ok ? "✓" : "✗"} ${name}${summary ? ` · ${summary}` : ""}`;
    if (preview) chip.title = truncateText(preview, 300);
  }

  function toolResultNode(name, content) {
    const details = document.createElement("details");
    details.className = "tool-result";
    const label = document.createElement("summary");
    label.textContent = `${name} 结果`;
    const pre = document.createElement("pre");
    pre.textContent = content;
    details.append(label, pre);
    return details;
  }

  /**
   * 工具调用折叠块：**收起时只占一行**，放在这一轮助手回复的上方。
   * 历史回放与实时流式共用它，避免两个路径长得不一样。
   */
  function buildToolFold(calls, resultsById) {
    const fold = document.createElement("details");
    fold.className = "tool-fold";
    const label = document.createElement("summary");
    const list = document.createElement("div");
    list.className = "tool-list";
    const results = document.createElement("div");
    results.className = "tool-results";
    fold.append(label, list, results);

    const names = [];
    let failed = 0;
    for (const call of calls) {
      const result = call.id ? resultsById.get(call.id) : undefined;
      const ok = !(result && result.status === "error");
      const summary = toolArgSummary(call.args);
      names.push(call.name);
      const chip = toolChip(call.name, summary);
      if (result) {
        if (!ok) failed += 1;
        paintToolChip(chip, call.name, summary, ok, result.content);
      }
      list.append(chip);
      if (result && result.content) results.append(toolResultNode(call.name, result.content));
    }
    label.textContent = toolFoldLabel(names, failed);
    return fold;
  }

  /** 历史里没有对应助手气泡时的兜底：单独一行放折叠块。 */
  function toolRow(fold) {
    const row = document.createElement("div");
    row.className = "msg assistant";
    const body = document.createElement("div");
    body.className = "msg-body";
    body.append(fold);
    row.append(avatarNode("tool"), body);
    return row;
  }

  function renderThread(messages) {
    clearMessages();
    const resultsById = new Map();
    for (const message of messages) {
      if (message.role === "tool" && message.tool_call_id) {
        resultsById.set(message.tool_call_id, message);
      }
    }

    let shown = 0;
    let pendingCalls = [];  // 还没落到助手气泡上的工具调用（跨连续 ai 消息累积）
    const referenced = new Set();

    // 把攒下的工具调用折成一个块；返回 null 表示这轮没调工具
    const flushPending = () => {
      if (!pendingCalls.length) return null;
      const fold = buildToolFold(pendingCalls, resultsById);
      pendingCalls = [];
      return fold;
    };

    for (const message of messages) {
      if (message.role === "human") {
        const leftover = flushPending();
        if (leftover) el("messages").append(toolRow(leftover));
        appendBubble("user", message.content || "");
        shown += 1;
      } else if (message.role === "ai") {
        const calls = Array.isArray(message.tool_calls) ? message.tool_calls : [];
        calls.forEach((call) => {
          if (call.id) referenced.add(call.id);
        });
        pendingCalls.push(...calls);

        if (message.content && message.content.trim()) {
          const bubble = appendMarkdown("assistant", message.content);
          // 工具折叠块放在这一轮回复的**上方**（收起时只占一行）
          const fold = flushPending();
          if (fold) bubble.body.prepend(fold);
          shown += 1;
        } else if (calls.length) {
          shown += 1;
        }
      } else if (
        message.role === "tool" &&
        (!message.tool_call_id || !referenced.has(message.tool_call_id))
      ) {
        const leftover = flushPending();
        if (leftover) el("messages").append(toolRow(leftover));
        el("messages").append(
          toolRow(
            buildToolFold(
              [{ name: message.name || "tool", args: {}, id: message.tool_call_id }],
              new Map([[message.tool_call_id, message]]),
            ),
          ),
        );
        shown += 1;
      }
    }
    // 收尾：只剩工具调用、没有最终回复的（例如被中断的运行）
    const trailing = flushPending();
    if (trailing) {
      el("messages").append(toolRow(trailing));
      shown += 1;
    }
    if (!shown) renderWelcome();
    el("messages").scrollTop = el("messages").scrollHeight;
  }

  async function openThread(threadId) {
    try {
      const response = await request(`/threads/${encodeURIComponent(threadId)}`);
      const body = await response.json();
      state.threadId = threadId;
      renderThread(body.messages || []);
      renderActive();
      setUrlThread(threadId);
      showError("");
    } catch (err) {
      showError(`打开会话失败：${err.message}`);
    }
  }

  function setUrlThread(threadId) {
    const url = new URL(location.href);
    if (threadId) url.searchParams.set("thread", threadId);
    else url.searchParams.delete("thread");
    history.replaceState(null, "", url);
  }

  function renderActive() {
    for (const item of el("threads").querySelectorAll(".thread")) {
      item.classList.toggle("active", item.dataset.id === state.threadId);
    }
  }

  function newChat() {
    state.threadId = null;
    renderWelcome();
    renderActive();
    setUrlThread(null);
    showError("");
    el("input").focus();
  }

  // ------------------------------------------------------------------ SSE 解析

  async function* readEvents(response) {
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      buffer = buffer.replace(/\r\n/g, "\n");

      let index;
      while ((index = buffer.indexOf("\n\n")) >= 0) {
        const raw = buffer.slice(0, index);
        buffer = buffer.slice(index + 2);

        let event = "message";
        const data = [];
        for (const line of raw.split("\n")) {
          if (line.startsWith("event:")) event = line.slice(6).trim();
          else if (line.startsWith("data:")) data.push(line.slice(5).trimStart());
        }
        if (!data.length) continue;
        try {
          yield { event, payload: JSON.parse(data.join("\n")) };
        } catch (_) {
          yield { event, payload: { text: data.join("\n") } };
        }
      }
    }
  }

  // ------------------------------------------------------------------ 发送

  async function send(message) {
    appendBubble("user", message);
    const assistant = appendBubble("assistant", "");
    assistant.bubble.append(typingNode());

    // 工具调用折叠块：**懒创建**（没调工具就不占位置），始终在回复上方、收起只占一行
    let toolFold = null;
    let toolList = null;
    let toolResults = null;
    let toolLabel = null;
    const toolNames = [];
    let toolFailed = 0;
    const chips = new Map();

    const refreshToolLabel = () => {
      if (toolLabel) toolLabel.textContent = toolFoldLabel(toolNames, toolFailed);
    };

    const ensureToolFold = () => {
      if (toolFold) return;
      toolFold = document.createElement("details");
      toolFold.className = "tool-fold";
      toolLabel = document.createElement("summary");
      toolList = document.createElement("div");
      toolList.className = "tool-list";
      toolResults = document.createElement("div");
      toolResults.className = "tool-results";
      toolFold.append(toolLabel, toolList, toolResults);
      assistant.body.prepend(toolFold);
    };

    let answer = "";
    let sawText = false;
    let failed = false;
    let renderQueued = false;

    const paintAnswer = () => {
      renderQueued = false;
      if (!answer) return;
      assistant.bubble.classList.add("md");
      assistant.bubble.innerHTML = renderMarkdown(answer);
      el("messages").scrollTop = el("messages").scrollHeight;
    };

    const scheduleAnswer = () => {
      if (renderQueued) return;
      renderQueued = true;
      requestAnimationFrame(paintAnswer);
    };

    state.busy = true;
    state.controller = new AbortController();
    updateComposer();

    try {
      const response = await request("/chat/stream", {
        method: "POST",
        headers: authHeaders(true),
        body: JSON.stringify({ message, thread_id: state.threadId || undefined }),
        signal: state.controller.signal,
      });

      for await (const { event, payload } of readEvents(response)) {
        if (event === "start") {
          state.threadId = payload.thread_id;
          setUrlThread(state.threadId);
          renderActive();
        } else if (event === "delta") {
          answer += payload.text || "";
          sawText = true;
          scheduleAnswer();
        } else if (event === "tool_call") {
          ensureToolFold();
          const summary = toolArgSummary(payload.args);
          const chip = toolChip(payload.name, summary);
          chips.set(payload.call_id, { chip, summary, name: payload.name });
          toolList.append(chip);
          toolNames.push(payload.name);
          refreshToolLabel();
        } else if (event === "tool_result") {
          const entry = chips.get(payload.call_id);
          const preview = payload.result || "";
          if (entry) {
            paintToolChip(entry.chip, entry.name, entry.summary, payload.ok, preview);
          }
          if (!payload.ok) toolFailed += 1;
          refreshToolLabel();
          if (preview) toolResults.append(toolResultNode(payload.name, preview));
        } else if (event === "done") {
          answer = payload.text || answer;
          if (!sawText && payload.text) answer = payload.text;
          state.threadId = payload.thread_id || state.threadId;
        } else if (event === "error") {
          failed = true;
          assistant.row.classList.add("error");
          assistant.bubble.classList.remove("md");
          assistant.bubble.textContent = payload.message || "运行失败";
        }
        el("messages").scrollTop = el("messages").scrollHeight;
      }

      if (failed) {
        // 错误信息已经写进气泡，不要被下面的兜底覆盖。
      } else if (answer) {
        assistant.bubble.classList.add("md");
        assistant.bubble.innerHTML = renderMarkdown(answer);
      } else if (toolFold) {
        // 只有工具调用没有最终回复：留折叠块，去掉空气泡
        assistant.bubble.remove();
      } else {
        assistant.bubble.textContent = "（没有输出）";
      }
    } catch (err) {
      if (err.name === "AbortError") {
        if (answer) {
          assistant.bubble.classList.add("md");
          assistant.bubble.innerHTML = `${renderMarkdown(answer)}<p class="stopped">（已停止）</p>`;
        } else {
          assistant.bubble.textContent = "（已停止）";
        }
      } else {
        assistant.row.classList.add("error");
        assistant.bubble.classList.remove("md");
        assistant.bubble.textContent = err.message;
      }
    } finally {
      state.busy = false;
      state.controller = null;
      updateComposer();
      refreshThreads();
      loadApprovals();
    }
  }

  function updateComposer() {
    const button = el("send");
    button.textContent = state.busy ? "停止" : "发送";
    button.className = state.busy ? "stop" : "";
  }

  // ------------------------------------------------------------------ 事件绑定

  function autoGrow() {
    const input = el("input");
    input.style.height = "auto";
    input.style.height = `${Math.min(180, input.scrollHeight)}px`;
  }

  el("composer").addEventListener("submit", (event) => {
    event.preventDefault();
    if (state.busy) {
      if (state.controller) state.controller.abort();
      return;
    }
    const input = el("input");
    const message = input.value.trim();
    if (!message) return;
    input.value = "";
    autoGrow();
    send(message);
  });

  el("input").addEventListener("input", autoGrow);
  el("input").addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      el("composer").requestSubmit();
    }
  });

  el("newChat").addEventListener("click", newChat);

  el("settingsBtn").addEventListener("click", () => {
    el("settings").classList.toggle("hidden");
  });

  el("saveSettings").addEventListener("click", () => {
    localStorage.setItem(LS_BASE, el("baseUrl").value.trim());
    localStorage.setItem(LS_TOKEN, el("token").value.trim());
    el("settings").classList.add("hidden");
    refreshHealth();
    refreshThreads();
    loadApprovals();
  });

  // 启动
  el("baseUrl").value = localStorage.getItem(LS_BASE) || "";
  el("token").value = localStorage.getItem(LS_TOKEN) || "";
  const initialThread = new URLSearchParams(location.search).get("thread");
  if (initialThread) {
    openThread(initialThread);
  } else {
    renderWelcome();
  }
  refreshHealth();
  refreshThreads();
  loadApprovals();
  // 只在跑着一轮时轮询：待确认的请求必然阻塞着某次运行，空闲时不必反复查库。
  setInterval(() => {
    if (state.busy) loadApprovals();
  }, 3000);
})();
</script>
</body>
</html>
